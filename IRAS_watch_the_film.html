<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch the Film</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<video id="v" src="IRAS_film.mp4" autoplay loop playsinline></video>
<script>
  var v = document.getElementById('v');
  v.volume = 1;
  var p = v.play();
  if (p && p.catch) { p.catch(function () { v.muted = true; v.play(); }); }
</script>
</body>
</html>
