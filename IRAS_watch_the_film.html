<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch the Film</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #b{position:fixed;top:2.2vh;right:2.2vh;width:3.4rem;height:3.4rem;padding:0;
     display:flex;align-items:center;justify-content:center;
     background:rgba(0,0,0,.28);border:0;border-radius:50%;cursor:pointer;
     opacity:.45;transition:opacity .15s ease,background .15s ease,transform .1s ease}
  #b:active{transform:scale(.94)}
  #b.ended{opacity:.95;background:rgba(0,0,0,.5)}
  #b svg{width:1.6rem;height:1.6rem;fill:#fff;display:block}
</style>
</head>
<body>
<video id="v" src="Watch%20the%20Film%20-%20h264.mp4" autoplay playsinline></video>
<button id="b" type="button" aria-label="Pause"></button>
<script>
  var v = document.getElementById('v');
  var b = document.getElementById('b');

  var ICON = {
    pause: '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play:  '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/></svg>',
    again: '<svg viewBox="0 0 24 24"><path d="M12 5V2.2c0-.5-.6-.7-.9-.4L7 5.3c-.3.2-.3.6 0 .8l4.1 3.5c.3.3.9 0 .9-.4V7a5 5 0 1 1-5 5 1 1 0 1 0-2 0 7 7 0 1 0 7-7z"/></svg>'
  };

  function label() {
    if (v.ended) { b.innerHTML = ICON.again; b.setAttribute('aria-label','Play again'); b.classList.add('ended'); return; }
    b.classList.remove('ended');
    b.innerHTML = v.paused ? ICON.play : ICON.pause;
    b.setAttribute('aria-label', v.paused ? 'Play' : 'Pause');
  }

  v.volume = 1;
  var p = v.play();
  if (p && p.catch) { p.catch(function () { v.muted = true; v.play(); }); }

  b.addEventListener('click', function () {
    if (v.ended) { v.currentTime = 0; v.play(); }
    else if (v.paused) { v.play(); }
    else { v.pause(); }
  });

  v.addEventListener('play', label);
  v.addEventListener('pause', label);
  v.addEventListener('ended', label);
  label();
</script>
</body>
</html>
