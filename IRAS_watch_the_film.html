<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch the Film</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #bar{position:fixed;left:0;right:0;bottom:4vh;display:flex;justify-content:center;
       pointer-events:none}
  #b{pointer-events:auto;min-width:16rem;padding:1.1rem 2.4rem;font-size:1.6rem;font-weight:600;
     color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.45);
     border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
     transition:background .15s ease,transform .1s ease}
  #b:active{transform:scale(.97);background:rgba(0,0,0,.75)}
  #b.ended{background:rgba(255,255,255,.92);color:#111;border-color:transparent}
</style>
</head>
<body>
<video id="v" src="Watch%20the%20Film%20-%20h264.mp4" autoplay playsinline></video>
<div id="bar"><button id="b" type="button">Pause</button></div>
<script>
  var v = document.getElementById('v');
  var b = document.getElementById('b');

  function label() {
    if (v.ended) { b.textContent = 'Play again'; b.classList.add('ended'); return; }
    b.classList.remove('ended');
    b.textContent = v.paused ? 'Play' : 'Pause';
  }

  v.volume = 1;
  var p = v.play();
  if (p && p.catch) { p.catch(function () { v.muted = true; v.play(); }); }

  b.addEventListener('click', function () {
    if (v.ended) { v.currentTime = 0; v.play(); }
    else if (v.paused) { v.play(); }
    else { v.pause(); }
  });

  v.addEventListener('play', label);
  v.addEventListener('pause', label);
  v.addEventListener('ended', label);
  label();
</script>
</body>
</html>
