<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tell us about your visit</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
   font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 html,body{height:100%;background:#f2f5f3;color:#11331f;overflow:hidden}
 #wrap{height:100%;display:flex;flex-direction:column}
 header{background:linear-gradient(135deg,#00733b,#01532c);color:#fff;padding:18px 26px 16px;flex:0 0 auto}
 header .t{font-size:14px;opacity:.85;letter-spacing:.2px}
 header .h{font-size:clamp(20px,2.6vh,28px);font-weight:800;margin-top:3px}
 .bar{height:6px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:14px;overflow:hidden}
 .bar i{display:block;height:100%;background:#ffc300;border-radius:99px;width:0;transition:width .28s ease}
 .step{font-size:12.5px;opacity:.85;margin-top:8px;font-weight:700;letter-spacing:.3px}
 main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:22px 26px;overflow-y:auto}
 .dim{display:inline-block;background:#ffc300;color:#11331f;font-weight:800;font-size:13px;
   padding:5px 13px;border-radius:99px;align-self:flex-start}
 .q{font-size:clamp(21px,3.4vh,34px);font-weight:800;line-height:1.28;margin:16px 0 4px;max-width:23ch}
 .scale{display:flex;gap:clamp(8px,1.4vw,16px);margin-top:26px}
 .sc{flex:1;aspect-ratio:1/1;max-height:118px;border:2.5px solid #cfdcd4;background:#fff;border-radius:18px;
   font-size:clamp(22px,3.2vh,32px);font-weight:800;color:#33564a;cursor:pointer;
   display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s,border-color .12s}
 .sc:active{transform:scale(.94)}
 .sc.on{background:#00733b;border-color:#00733b;color:#fff}
 .ends{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:13.5px;color:#4a6459;font-weight:600}
 .ends span{max-width:44%}
 .ends span:last-child{text-align:right}
 footer{flex:0 0 auto;padding:16px 26px 22px;display:flex;align-items:center;gap:14px}
 .btn{border:0;border-radius:14px;padding:15px 26px;font-size:16px;font-weight:800;cursor:pointer}
 .pri{background:#00733b;color:#fff;flex:1}
 .pri[disabled]{background:#b9cec4;cursor:default}
 .gho{background:transparent;color:#4a6459;border:2px solid #cfdcd4}
 .lnk{background:none;border:0;color:#4a6459;font-size:14.5px;font-weight:700;text-decoration:underline;cursor:pointer;padding:10px}
 .rev{display:flex;flex-direction:column;gap:10px;margin-top:6px}
 .row{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #e2ebe6;border-radius:14px;
   padding:13px 16px;cursor:pointer}
 .row .n{font-size:12.5px;font-weight:800;color:#6c8578;letter-spacing:.3px}
 .row .q2{font-size:15px;font-weight:700;line-height:1.3;flex:1}
 .row .v{font-size:20px;font-weight:800;color:#00733b;min-width:58px;text-align:right}
 .row .v.sk{color:#9fb3a8;font-size:14px}
 .mid{text-align:center;max-width:30ch;margin:0 auto}
 .tick{width:74px;height:74px;border-radius:50%;background:#00733b;margin:0 auto 20px;
   display:flex;align-items:center;justify-content:center}
 .qr{background:#fff;border:2px solid #e2ebe6;border-radius:18px;padding:18px;display:inline-block;margin-top:22px}
 .qr svg{display:block;width:150px;height:150px}
 .fine{font-size:12.5px;color:#6c8578;margin-top:16px;line-height:1.5}
 table{width:100%;border-collapse:collapse;font-size:14px}
 th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #e2ebe6}
 th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#6c8578}
 td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
 .warn{background:#fff4d6;border:1px solid #f0d78a;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.5;margin-top:16px}
 textarea{width:100%;height:150px;margin-top:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
   border:1px solid #cfdcd4;border-radius:10px;padding:10px}
</style>
</head>
<body>
<div id="wrap">
 <header>
  <div class="t">Morrisons Pontefract</div>
  <div class="h" id="hd">Tell us about your visit</div>
  <div class="bar"><i id="pb"></i></div>
  <div class="step" id="st"></div>
 </header>
 <main id="main"></main>
 <footer id="foot"></footer>
</div>
<script>
(function(){
// ---------------------------------------------------------------
// Kalau Morrisons memberi endpoint, isi di sini. Kosong = simpan lokal saja.
var ENDPOINT = "";
// ---------------------------------------------------------------
var STORE='morrisons_feedback_v1';
var TIMEOUT_HINT=180;

var Q=[
 {d:'Product Quality & Value', q:'How well does our store meet your specific needs?',
  lo:'Does not meet my needs at all', hi:'Exceeds all of my expectations'},
 {d:'Customer Effort',         q:'How easy was it to navigate our store and complete your transaction?',
  lo:'Extremely difficult or confusing', hi:'Effortless and completely seamless'},
 {d:'Customer Service & Support', q:'How satisfied are you with the speed and helpfulness of our store team?',
  lo:'Very slow or unhelpful', hi:'Exceptionally fast and helpful'},
 {d:'Value for Money',         q:'How would you rate the value received compared to the price you paid?',
  lo:'Poor value for money', hi:'Excellent value for money'},
 {d:'Future Intent',           q:'How likely are you to choose us again for your next purchase?',
  lo:'Definitely will not return', hi:'Definitely will return'}
];

var QR_N=29;
var QR_D="M0 0h7v1h-7zM8 0h1v1h-1zM12 0h1v1h-1zM17 0h2v1h-2zM22 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM9 1h2v1h-2zM16 1h2v1h-2zM19 1h1v1h-1zM22 1h1v1h-1zM28 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM11 2h1v1h-1zM13 2h1v1h-1zM15 2h5v1h-5zM22 2h1v1h-1zM24 2h3v1h-3zM28 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM8 3h1v1h-1zM10 3h3v1h-3zM14 3h3v1h-3zM18 3h1v1h-1zM22 3h1v1h-1zM24 3h3v1h-3zM28 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM8 4h2v1h-2zM12 4h3v1h-3zM16 4h3v1h-3zM22 4h1v1h-1zM24 4h3v1h-3zM28 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM8 5h4v1h-4zM13 5h3v1h-3zM19 5h2v1h-2zM22 5h1v1h-1zM28 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM22 6h7v1h-7zM8 7h2v1h-2zM12 7h1v1h-1zM14 7h1v1h-1zM17 7h4v1h-4zM0 8h1v1h-1zM4 8h1v1h-1zM6 8h3v1h-3zM11 8h5v1h-5zM17 8h2v1h-2zM20 8h6v1h-6zM28 8h1v1h-1zM0 9h1v1h-1zM2 9h2v1h-2zM10 9h1v1h-1zM12 9h1v1h-1zM17 9h2v1h-2zM20 9h1v1h-1zM22 9h7v1h-7zM0 10h2v1h-2zM3 10h2v1h-2zM6 10h2v1h-2zM11 10h1v1h-1zM13 10h3v1h-3zM18 10h1v1h-1zM20 10h1v1h-1zM28 10h1v1h-1zM1 11h1v1h-1zM3 11h1v1h-1zM7 11h2v1h-2zM12 11h2v1h-2zM17 11h3v1h-3zM24 11h2v1h-2zM27 11h2v1h-2zM2 12h9v1h-9zM12 12h2v1h-2zM15 12h1v1h-1zM17 12h1v1h-1zM19 12h1v1h-1zM21 12h1v1h-1zM27 12h1v1h-1zM0 13h1v1h-1zM3 13h2v1h-2zM8 13h1v1h-1zM10 13h6v1h-6zM18 13h1v1h-1zM21 13h8v1h-8zM0 14h1v1h-1zM4 14h1v1h-1zM6 14h2v1h-2zM11 14h2v1h-2zM15 14h1v1h-1zM18 14h1v1h-1zM21 14h6v1h-6zM28 14h1v1h-1zM0 15h3v1h-3zM5 15h1v1h-1zM11 15h2v1h-2zM14 15h1v1h-1zM16 15h2v1h-2zM19 15h3v1h-3zM24 15h1v1h-1zM27 15h2v1h-2zM0 16h1v1h-1zM2 16h1v1h-1zM4 16h1v1h-1zM6 16h1v1h-1zM10 16h1v1h-1zM13 16h3v1h-3zM17 16h1v1h-1zM20 16h2v1h-2zM27 16h1v1h-1zM0 17h1v1h-1zM3 17h2v1h-2zM7 17h4v1h-4zM15 17h2v1h-2zM18 17h1v1h-1zM21 17h2v1h-2zM24 17h2v1h-2zM27 17h2v1h-2zM3 18h1v1h-1zM5 18h2v1h-2zM8 18h1v1h-1zM10 18h1v1h-1zM12 18h4v1h-4zM17 18h2v1h-2zM20 18h3v1h-3zM26 18h1v1h-1zM28 18h1v1h-1zM2 19h2v1h-2zM5 19h1v1h-1zM7 19h1v1h-1zM9 19h3v1h-3zM13 19h1v1h-1zM16 19h6v1h-6zM23 19h2v1h-2zM27 19h2v1h-2zM0 20h5v1h-5zM6 20h1v1h-1zM9 20h2v1h-2zM12 20h2v1h-2zM17 20h1v1h-1zM20 20h6v1h-6zM28 20h1v1h-1zM8 21h2v1h-2zM11 21h1v1h-1zM13 21h4v1h-4zM18 21h3v1h-3zM24 21h1v1h-1zM28 21h1v1h-1zM0 22h7v1h-7zM8 22h3v1h-3zM12 22h1v1h-1zM15 22h1v1h-1zM17 22h4v1h-4zM22 22h1v1h-1zM24 22h3v1h-3zM28 22h1v1h-1zM0 23h1v1h-1zM6 23h1v1h-1zM9 23h1v1h-1zM11 23h2v1h-2zM14 23h7v1h-7zM24 23h1v1h-1zM27 23h1v1h-1zM0 24h1v1h-1zM2 24h3v1h-3zM6 24h1v1h-1zM8 24h2v1h-2zM13 24h2v1h-2zM17 24h1v1h-1zM19 24h7v1h-7zM0 25h1v1h-1zM2 25h3v1h-3zM6 25h1v1h-1zM10 25h3v1h-3zM15 25h2v1h-2zM18 25h1v1h-1zM21 25h1v1h-1zM23 25h1v1h-1zM28 25h1v1h-1zM0 26h1v1h-1zM2 26h3v1h-3zM6 26h1v1h-1zM11 26h3v1h-3zM15 26h4v1h-4zM21 26h1v1h-1zM25 26h4v1h-4zM0 27h1v1h-1zM6 27h1v1h-1zM9 27h3v1h-3zM14 27h1v1h-1zM16 27h2v1h-2zM19 27h3v1h-3zM25 27h1v1h-1zM27 27h2v1h-2zM0 28h7v1h-7zM8 28h1v1h-1zM10 28h5v1h-5zM17 28h1v1h-1zM20 28h2v1h-2zM23 28h1v1h-1zM25 28h1v1h-1zM27 28h1v1h-1z";

var main=document.getElementById('main'), foot=document.getElementById('foot');
var hd=document.getElementById('hd'), pb=document.getElementById('pb'), st=document.getElementById('st');
var ans=[null,null,null,null,null];
var view=0;          // 0 intro, 1..5 soal, 6 review, 7 terima kasih
var editing=false;
var idle=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function read(){ try{ return JSON.parse(localStorage.getItem(STORE)||'[]'); }catch(e){ return []; } }
function write(a){ try{ localStorage.setItem(STORE, JSON.stringify(a)); return true; }catch(e){ return false; } }
function resetIdle(){ clearTimeout(idle); idle=setTimeout(function(){ if(view>0&&view<7) render(0); }, 90000); }
addEventListener('touchstart',resetIdle); addEventListener('click',resetIdle);

function progress(){
 if(view===0){pb.style.width='0%'; st.textContent='Five short questions, about twenty seconds';}
 else if(view<=5){pb.style.width=(view/6*100)+'%'; st.textContent='Question '+view+' of 5';}
 else if(view===6){pb.style.width='92%'; st.textContent='Check your answers';}
 else {pb.style.width='100%'; st.textContent='All done';}
}

function render(v){
 view=v; progress(); main.innerHTML=''; foot.innerHTML='';
 if(v===0) return intro();
 if(v>=1&&v<=5) return question(v-1);
 if(v===6) return review();
 return thanks();
}

function intro(){
 hd.textContent='Tell us about your visit';
 main.innerHTML='<div class="mid" style="text-align:left;max-width:34ch">'+
  '<div class="q" style="margin-top:0">How did we do today?</div>'+
  '<p style="font-size:16.5px;line-height:1.6;color:#3d5a4d;margin-top:10px">'+
  'Five questions, each scored one to five. It takes about twenty seconds and you can skip any question.</p>'+
  '<p class="fine">We do not ask for your name, your card number, or any personal details.</p></div>';
 var b=document.createElement('button'); b.className='btn pri'; b.textContent='Start';
 b.onclick=function(){render(1);}; foot.appendChild(b);
}

function question(i){
 var item=Q[i];
 hd.textContent='Tell us about your visit';
 var wrap=document.createElement('div');
 wrap.innerHTML='<span class="dim">'+esc(item.d)+'</span><div class="q">'+esc(item.q)+'</div>';
 var sc=document.createElement('div'); sc.className='scale';
 for(var k=1;k<=5;k++){(function(k){
   var b=document.createElement('button'); b.className='sc'+(ans[i]===k?' on':''); b.textContent=k;
   b.setAttribute('aria-label','Score '+k+' out of 5');
   b.onclick=function(){
     ans[i]=k;
     Array.prototype.forEach.call(sc.children,function(e){e.classList.remove('on');});
     b.classList.add('on');
     setTimeout(function(){ render(editing?6:(i+2<=5?i+2:6)); editing=false; },220);
   };
   sc.appendChild(b);
 })(k);}
 wrap.appendChild(sc);
 var ends=document.createElement('div'); ends.className='ends';
 ends.innerHTML='<span>1 &middot; '+esc(item.lo)+'</span><span>5 &middot; '+esc(item.hi)+'</span>';
 wrap.appendChild(ends);
 main.appendChild(wrap);

 var back=document.createElement('button'); back.className='btn gho'; back.textContent='Back';
 back.onclick=function(){ editing=false; render(i===0?0:i); };
 var skip=document.createElement('button'); skip.className='lnk'; skip.textContent='Skip this question';
 skip.onclick=function(){ ans[i]=null; render(editing?6:(i+2<=5?i+2:6)); editing=false; };
 foot.appendChild(back);
 var sp=document.createElement('div'); sp.style.flex='1'; foot.appendChild(sp);
 foot.appendChild(skip);
}

function review(){
 hd.textContent='Check your answers';
 var box=document.createElement('div'); box.className='rev';
 Q.forEach(function(item,i){
  var r=document.createElement('div'); r.className='row';
  r.innerHTML='<div class="n">'+(i+1)+'</div><div class="q2">'+esc(item.d)+'</div>'+
    '<div class="v'+(ans[i]===null?' sk':'')+'">'+(ans[i]===null?'Skipped':ans[i]+' / 5')+'</div>';
  r.onclick=function(){ editing=true; render(i+1); };
  box.appendChild(r);
 });
 main.appendChild(box);
 var note=document.createElement('p'); note.className='fine';
 note.textContent='Tap any line to change it.';
 main.appendChild(note);

 var back=document.createElement('button'); back.className='btn gho'; back.textContent='Back';
 back.onclick=function(){ render(5); };
 var send=document.createElement('button'); send.className='btn pri'; send.textContent='Send feedback';
 var any=ans.some(function(v){return v!==null;});
 if(!any){ send.disabled=true; send.textContent='Answer at least one question'; }
 send.onclick=submit;
 foot.appendChild(back); foot.appendChild(send);
}

function submit(){
 var rec={ ts:new Date().toISOString(), store:'Pontefract', source:'kiosk-interactive-km',
           scores:{ product_quality_value:ans[0], customer_effort:ans[1],
                    service_support:ans[2], value_for_money:ans[3], future_intent:ans[4] } };
 var all=read(); all.push(rec); write(all);
 if(ENDPOINT){
  try{ fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); }catch(e){}
 }
 render(7);
}

function thanks(){
 hd.textContent='Thank you';
 main.innerHTML='<div class="mid">'+
  '<div class="tick"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg></div>'+
  '<div class="q" style="margin:0 auto">Thank you</div>'+
  '<p style="font-size:16.5px;line-height:1.6;color:#3d5a4d;margin-top:10px">Your answers go to the Pontefract store team.</p>'+
  '<div class="qr"><svg viewBox="0 0 '+QR_N+' '+QR_N+'" shape-rendering="crispEdges"><path d="'+QR_D+'" fill="#11331f"/></svg>'+
  '<div style="font-size:12.5px;font-weight:700;margin-top:10px;color:#3d5a4d">Want to say more?<br>Scan to open our feedback form</div></div>'+
  '</div>';
 var b=document.createElement('button'); b.className='btn pri'; b.textContent='Done';
 b.onclick=close_; foot.appendChild(b);
 setTimeout(close_, 12000);
}
function close_(){
 try{ if(window.ARC && typeof ARC.close==='function'){ ARC.close(); return; } }catch(e){}
 ans=[null,null,null,null,null]; render(0);
}

// ---------- tampilan hasil untuk tim toko: ?view=results ----------
function results(){
 document.getElementById('wrap').style.overflow='auto';
 hd.textContent='Feedback collected on this screen';
 pb.style.width='100%';
 var all=read();
 st.textContent=all.length+' response'+(all.length===1?'':'s')+' stored on this device';
 var keys=['product_quality_value','customer_effort','service_support','value_for_money','future_intent'];
 var rows='';
 keys.forEach(function(k,i){
  var v=all.map(function(r){return r.scores[k];}).filter(function(x){return typeof x==='number';});
  var mean=v.length? (v.reduce(function(a,b){return a+b;},0)/v.length).toFixed(2) : '--';
  var dist=[1,2,3,4,5].map(function(s){return v.filter(function(x){return x===s;}).length;}).join(' / ');
  rows+='<tr><td>'+(i+1)+'. '+esc(Q[i].d)+'</td><td class="num">'+v.length+'</td><td class="num">'+mean+'</td><td class="num" style="font-weight:600">'+dist+'</td></tr>';
 });
 var fi=all.map(function(r){return r.scores.future_intent;}).filter(function(x){return typeof x==='number';});
 var prom=fi.filter(function(x){return x===5;}).length, det=fi.filter(function(x){return x<=3;}).length;
 var nps=fi.length? Math.round((prom-det)/fi.length*100) : null;
 main.innerHTML='<table><thead><tr><th>Dimension</th><th style="text-align:right">n</th>'+
  '<th style="text-align:right">Mean</th><th style="text-align:right">1/2/3/4/5</th></tr></thead><tbody>'+rows+'</tbody></table>'+
  '<div class="warn"><b>NPS on the Morrisons bands: '+(nps===null?'--':nps)+'</b><br>'+
  'Calculated as written in the brief: promoter = 5 only, detractor = 3 or below, on a 1 to 5 scale. '+
  'Nobody can score 0, and only a 5 counts as a promoter, so this number is not comparable with an 0 to 10 NPS measured elsewhere in the business. '+
  'Worth settling with whoever owns NPS before the trial sets a baseline.</div>'+
  '<p class="fine">Responses are stored in this browser on this kiosk only. They are not sent anywhere until an endpoint is configured. '+
  'Clearing the app data or reinstalling will erase them. Copy the CSV below before that happens.</p>'+
  '<textarea readonly id="csv"></textarea>';
 var csv='timestamp,product_quality_value,customer_effort,service_support,value_for_money,future_intent\n'+
  all.map(function(r){return [r.ts].concat(keys.map(function(k){return r.scores[k]===null?'':r.scores[k];})).join(',');}).join('\n');
 document.getElementById('csv').value=csv;
 var c=document.createElement('button'); c.className='btn gho'; c.textContent='Copy CSV';
 c.onclick=function(){var t=document.getElementById('csv'); t.select(); try{document.execCommand('copy'); c.textContent='Copied';}catch(e){} };
 var w=document.createElement('button'); w.className='btn gho'; w.textContent='Clear all responses';
 w.onclick=function(){ if(confirm('Delete every response stored on this kiosk? This cannot be undone.')){ write([]); results(); } };
 foot.appendChild(c); foot.appendChild(w);
}

var p=new URLSearchParams(location.search);
if((p.get('view')||'')==='results') results(); else { render(0); resetIdle(); }
})();
</script>
</body>
</html>
