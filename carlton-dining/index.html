<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dining at Carlton Hotel Singapore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Taken from carltonhotel.sg: --primary-text-color #615450,
     --action-background-color / --h2-font-color #372B4F, --card-bg-color #EAE6E3 */
  --ink:#4a3f3b; --ink2:#615450; --muted:#8e817c; --line:#dcd5d0;
  --paper:#EAE6E3; --card:#fff; --deep:#372B4F; --gold:#8c7a93;
  --serif:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --sans:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --accent:var(--deep);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
[hidden]{display:none!important}
#app{min-height:100%}

/* ───────────────────────── masthead ───────────────────────── */
.mast{background:var(--deep);color:#fff;text-align:center;padding:30px 22px 26px}
.mast .k{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#cdbfd4;font-weight:600}
.mast h1{margin:12px 0 0;font:600 30px/1.12 var(--serif);letter-spacing:.055em;text-transform:uppercase}
.mast p{margin:10px auto 0;max-width:30em;font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.74)}
.mast .rule{width:34px;height:1px;background:#cdbfd4;margin:16px auto 0;opacity:.75}

/* ───────────────────────── outlet cards ───────────────────── */
.cards{padding:18px 16px 40px;display:grid;gap:16px}
.ocard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:3px;overflow:hidden;box-shadow:0 1px 2px rgba(31,60,51,.04)}
.ocard .ph{position:relative;aspect-ratio:16/9;overflow:hidden;background:#ded7d2}
.ocard .ph img{width:100%;height:100%;object-fit:cover}
.ocard .ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(30,22,36,.9) 0,rgba(30,22,36,.56) 24%,
    rgba(30,22,36,.04) 58%,transparent 100%)}
.ocard .ph .on{position:absolute;left:20px;right:20px;bottom:16px;z-index:2;color:#fff}
.ocard .ph .on .kind{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  font-weight:700;color:#d8c9de;margin-bottom:6px;text-shadow:0 1px 6px rgba(26,18,32,.7)}
.ocard .ph .on h2{margin:0;font:400 22px/1.2 var(--serif);text-shadow:0 2px 14px rgba(20,14,24,.55)}
.ocard .bd{padding:16px 20px 18px}
.ocard .bd p{margin:0;font-size:13.5px;line-height:1.62;color:var(--ink2)}
.ocard .bd .meta{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  font-size:11.5px;color:var(--muted)}
.ocard .bd .meta b{color:var(--ink);font-weight:650}
.ocard.shut .ph img{filter:grayscale(1) contrast(.92)}
.badge{display:inline-block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:700;padding:5px 10px;border-radius:2px;background:#ece7ef;color:#6b5d76}

/* ───────────────────────── outlet page ────────────────────── */
.ohero{position:relative;aspect-ratio:16/9;overflow:hidden;background:#ded7d2}
.ohero img{width:100%;height:100%;object-fit:cover}
.ohero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(30,22,36,.92) 0,rgba(30,22,36,.62) 22%,
    rgba(30,22,36,.06) 60%,rgba(30,22,36,.3) 100%)}
.ohero .on{position:absolute;left:22px;right:22px;bottom:20px;z-index:2;color:#fff}
.ohero .on .kind{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;
  color:#d8c9de;margin-bottom:7px;text-shadow:0 1px 6px rgba(26,18,32,.7)}
.ohero .on h2{margin:0;font:400 26px/1.18 var(--serif);text-shadow:0 2px 14px rgba(20,14,24,.55)}
.navback{position:absolute;top:16px;left:14px;z-index:3;display:inline-flex;align-items:center;gap:8px;
  min-height:44px;padding:0 16px 0 12px;border-radius:999px;background:rgba(250,248,243,.94);
  color:var(--ink);font-size:13.5px;font-weight:650;backdrop-filter:blur(8px)}
.obody{padding:20px 22px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.obody .lead{margin:0;font-size:14.5px;line-height:1.66;color:var(--ink2)}
.ofacts{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  display:grid;gap:9px;font-size:13px;color:var(--ink2);line-height:1.6}
.ofacts .row{display:flex;gap:12px}
.ofacts .lab{flex:0 0 76px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  font-weight:700;color:var(--accent);padding-top:3px}
.ofacts .val b{display:block;color:var(--ink);font-weight:600}
.onote{margin:14px 0 0;font-size:12px;line-height:1.6;color:var(--muted);font-style:italic}

.mlist{padding:20px 22px 44px}
.mlist h3{margin:0 0 12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  font-weight:700;color:var(--accent)}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:3px;padding:16px 18px;min-height:76px;margin-bottom:10px}
.mbtn .t{flex:1;min-width:0}
.mbtn .t b{display:block;font:500 17px/1.3 var(--serif);letter-spacing:.02em}
.mbtn .t .zh{margin-left:9px;font-size:14px;color:var(--muted);letter-spacing:.09em}
.mbtn .t span{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.mbtn .go{flex:0 0 auto;font-size:19px;color:var(--accent)}
.mbtn[disabled]{opacity:.5}
.mbtn[disabled] .go{color:var(--muted)}

/* ───────────────────────── menu viewer ────────────────────── */
.viewer{display:flex;flex-direction:column;height:100dvh;background:#e2dcd8}
.vbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:var(--card);border-bottom:1px solid var(--line)}
.vbar .vb{min-height:44px;padding:0 14px 0 10px;display:inline-flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:650;border-radius:999px;color:var(--ink)}
.vbar .ti{flex:1;min-width:0;text-align:center}
.vbar .ti b{display:block;font:500 15px/1.25 var(--serif);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.vbar .ti span{display:block;font-size:11px;color:var(--muted);margin-top:2px;
  font-variant-numeric:tabular-nums}
.vbar .sp{flex:0 0 76px}

.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#e2dcd8;
  touch-action:none;display:grid;place-items:center}
.stage img{max-width:100%;max-height:100%;object-fit:contain;
  box-shadow:0 2px 18px rgba(32,24,38,.16);transform-origin:center center;will-change:transform}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);
  font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.zhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;
  background:rgba(29,35,32,.82);color:#fff;font-size:11.5px;padding:7px 14px;border-radius:999px;
  pointer-events:none;opacity:0;transition:opacity .3s}
.zhint.on{opacity:1}

.vfoot{flex:0 0 auto;display:flex;align-items:center;gap:0;background:var(--card);
  border-top:1px solid var(--line)}
.rail{flex:1 1 auto;min-width:0;display:flex;gap:9px;overflow-x:auto;padding:11px 14px;
  scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;border:2px solid transparent;border-radius:2px;overflow:hidden;
  background:#e2dcd8;line-height:0;position:relative}
.rail button img{width:52px;height:74px;object-fit:cover}
.rail button.on{border-color:var(--accent)}
.rail button i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:9px;
  text-align:center;background:rgba(29,35,32,.62);color:#fff;line-height:13px;
  font-variant-numeric:tabular-nums}

.qrp{display:none}

/* jump-to-section — thumbnails show what a page looks like, not what is on it */
.jump{position:absolute;inset:0;z-index:8;background:rgba(40,30,48,.42);display:none}
.jump.on{display:block}
.jsheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--card);
  display:flex;flex-direction:column;animation:ju .24s ease-out both;overflow:hidden}
@keyframes ju{from{transform:translateY(100%)}to{transform:none}}
.jsheet .jh{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:16px 20px 13px;border-bottom:1px solid var(--line)}
.jsheet .jh b{font:500 12px/1 var(--serif);letter-spacing:.17em;text-transform:uppercase;color:var(--deep)}
.jsheet .jh button{min-height:44px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.jlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.jlist button{display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;
  padding:15px 20px;border-bottom:1px solid var(--line);min-height:56px}
.jlist button span{flex:1;font-size:15px}
.jlist button i{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.jlist button.on span{color:var(--deep);font-weight:650}
.vbar .jb{flex:0 0 auto;min-height:44px;padding:0 15px;border:1px solid var(--line);
  border-radius:999px;font-size:13px;font-weight:650;color:var(--deep);background:var(--card)}

/* ───────────── kiosk (html.k) ───────────── */
html.k .cards{max-width:960px;margin:0 auto;padding:26px 24px 56px;gap:22px}
html.k .mast{padding:48px 24px 42px}
html.k .mast h1{font-size:44px} .mast p{font-size:17px} .mast .k{font-size:12px}
html.k .ocard .ph .on h2{font-size:31px}
html.k .ocard .ph .on .kind{font-size:11px}
html.k .ocard .bd{padding:22px 28px 24px}
html.k .ocard .bd p{font-size:16.5px}
html.k .ocard .bd .meta{font-size:13.5px}
html.k .ohero{aspect-ratio:21/9}
html.k .ohero .on h2{font-size:38px}
html.k .obody,.mlist{max-width:960px;margin:0 auto}
html.k .obody .lead{font-size:18px}
html.k .ofacts{font-size:15px}
html.k .mbtn{min-height:96px;padding:20px 26px}
html.k .mbtn .t b{font-size:21px}
html.k .navback{min-height:56px;font-size:16px;padding:0 22px 0 16px;top:22px;left:20px}
html.k .vbar{padding:14px 20px}
html.k .vbar .vb{min-height:56px;font-size:16px;padding:0 20px 0 14px}
html.k .vbar .jb{min-height:56px;font-size:15px;padding:0 22px}
html.k .jlist button{min-height:76px;padding:19px 26px}
html.k .jlist button span{font-size:19px}
html.k .jsheet .jh{padding:20px 26px 16px}
html.k .vbar .ti b{font-size:19px} .vbar .ti span{font-size:13px}
html.k .rail{padding:14px 20px;gap:12px}
html.k .rail button img{width:76px;height:108px}
html.k .qrp{display:flex;align-items:center;gap:15px;flex:0 0 auto;
    padding:12px 22px 12px 18px;border-left:1px solid var(--line);align-self:stretch}
html.k .qrp svg{width:104px;height:104px;display:block}
html.k .qrp .tx{max-width:160px}
html.k .qrp .tx b{display:block;font:500 12px/1.35 var(--serif);letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
html.k .qrp .tx span{font-size:11.5px;line-height:1.45;color:var(--ink2)}


.foot{padding:22px 24px 36px;font-size:11px;line-height:1.7;color:var(--muted);text-align:center}
.foot b{color:var(--ink2)}
/* testing-override badge: top-right so it never covers the thumbnail rail */
.pill{position:fixed;right:10px;top:10px;z-index:60;pointer-events:none;
  background:var(--deep);color:#fff;font-size:10.5px;letter-spacing:.06em;
  padding:6px 12px;border-radius:999px;opacity:.78}
</style></head>

/* ---------- testing override: ?view=kiosk | ?view=mobile ---------- */
var FORCED=((location.search||"").match(/[?&]view=(kiosk|mobile)/)||[])[1]||null;
function inFrame(){
  /* The ARC kiosk card opens this page inside a webview panel, which is far
     narrower than the kiosk screen. Measuring the viewport therefore reports a
     phone and the QR panel stays hidden — exactly what happened on the tablet.
     Being framed at all means we are inside the kiosk. */
  try { return window.top !== window.self } catch(e) { return true }
}
function setMode(){
  /* 900x900 was too strict: it also rejected a normal laptop window and a
     tablet held upright. The shortest side is what separates a phone from a
     kiosk: phone portrait 390, phone landscape 430, laptop 645, tablet 820,
     kiosk 1080. A minimum width keeps tall narrow windows out. */
  var w = window.innerWidth, h = window.innerHeight;
  var kiosk = FORCED ? FORCED==="kiosk"
            : (inFrame() || (w>=768 && Math.min(w,h)>=500));
  var r=document.documentElement;
  r.classList.toggle("k", kiosk); r.classList.toggle("m", !kiosk);
}
setMode();
window.addEventListener("resize", function(){
  var was=document.documentElement.classList.contains("k");
  setMode();
  if(was!==document.documentElement.classList.contains("k")){
    var keep=VIEW.i;                 /* survive the redraw on rotation */
    draw();
    if(VIEW.pages.length) show(Math.min(keep, VIEW.pages.length-1));
  }
});

  $("#back").onclick=function(){ goto("#") };
  [].forEach.call(app.querySelectorAll("[data-m]"),function(b){
    if(b.disabled) return;
    b.onclick=function(){ goto("#"+b.dataset.m) } });
}

/* ---------- menu viewer ---------- */
var VIEW = { pages:[], secs:[], i:0, scale:1, tx:0, ty:0, fit:1 };

function renderMenu(o,m){
  var pages=pagesOf(m.id), secs=(m.sections||[]).filter(function(x){
    return pages.some(function(p){ return p.page===x.p }) });
  VIEW.pages=pages; VIEW.i=0; VIEW.secs=secs;
  var h='<div class="viewer" style="--accent:'+esc(o.accent)+'">'
      + '<div class="vbar"><button class="vb" id="back">&#8592; '+esc(o.short||o.name)+'</button>'
      + '<div class="ti"><b>'+esc(m.name)+'</b><span id="pg"></span></div>'
      + (secs.length ? '<button class="jb" id="jopen">Sections</button>' : '<div class="sp"></div>')
      + '</div>'
      + '<div class="stage" id="stage"><div class="ld" id="ld">Loading</div>'
      + '<img id="pageimg" alt="" decoding="async">'
      + '<div class="zhint" id="zh">Pinch to zoom &middot; double-tap to fit</div>'
      + (secs.length ? '<div class="jump" id="jump"><div class="jsheet">'
          + '<div class="jh"><b>Jump to a section</b><button id="jclose">Close</button></div>'
          + '<div class="jlist">'+secs.map(function(x,i){
              return '<button data-j="'+i+'"><span>'+esc(x.n)+'</span><i>Page '+x.p+'</i></button>' }).join("")
          + '</div></div></div>' : '')
      + '</div><div class="vfoot"><div class="rail" id="rail"></div>'
      + (QR[m.id] ? '<div class="qrp">'+QR[m.id]
        + '<div class="tx"><b>Take it with you</b><span>Scan to open this menu on your phone.</span></div></div>' : '')
      + '</div></div>';
  app.innerHTML=h;
  $("#back").onclick=function(){ goto("#"+o.id) };
  $("#rail").innerHTML = pages.map(function(p,i){
    return '<button data-i="'+i+'"'+(i===0?' class="on"':'')+'>'
         + '<img src="'+esc(p.thumb)+'" alt="" loading="lazy" decoding="async">'
         + '<i>'+p.page+'</i></button>' }).join("");
  [].forEach.call(app.querySelectorAll("#rail [data-i]"),function(b){
    b.onclick=function(){ show(+b.dataset.i) } });
  if(secs.length){
    var jp=$("#jump");
    $("#jopen").onclick=function(){ jp.classList.add("on"); markSection() };
    $("#jclose").onclick=function(){ jp.classList.remove("on") };
    jp.onclick=function(e){ if(e.target===jp) jp.classList.remove("on") };
    [].forEach.call(app.querySelectorAll("[data-j]"),function(b){
      b.onclick=function(){
        var sec=secs[+b.dataset.j];
        for(var i=0;i<pages.length;i++) if(pages[i].page===sec.p){ show(i); break }
        jp.classList.remove("on");
      } });
  }
  wireZoom();
  show(0);
  var zh=$("#zh"); zh.classList.add("on"); setTimeout(function(){ zh.classList.remove("on") },2600);
}

function show(i){
  if(i<0||i>=VIEW.pages.length) return;
  VIEW.i=i;
  var p=VIEW.pages[i], img=$("#pageimg"), ld=$("#ld");
  ld.hidden=false; img.style.visibility="hidden";
  img.onload=function(){ ld.hidden=true; img.style.visibility="visible"; resetZoom(); preload(i) };
  img.onerror=function(){ ld.textContent="Could not load this page"; };
  img.src=p.src;
  $("#pg").textContent="Page "+p.page+" of "+VIEW.pages[VIEW.pages.length-1].page;
  [].forEach.call(app.querySelectorAll("#rail [data-i]"),function(b){
    b.classList.toggle("on", +b.dataset.i===i) });
  var on=app.querySelector("#rail [data-i='"+i+"']");
  if(on && on.scrollIntoView) on.scrollIntoView({inline:"center",block:"nearest"});
  markSection();
}
/* highlight the section the current page belongs to */
function markSection(){
  var secs=VIEW.secs||[]; if(!secs.length) return;
  var pg=VIEW.pages[VIEW.i] && VIEW.pages[VIEW.i].page, best=-1;
  for(var i=0;i<secs.length;i++) if(secs[i].p<=pg) best=i;
  [].forEach.call(app.querySelectorAll("[data-j]"),function(b){
    b.classList.toggle("on", +b.dataset.j===best) });
}
function preload(i){                       /* neighbours only — never the whole menu */
  [i-1,i+1].forEach(function(j){
    if(j<0||j>=VIEW.pages.length) return;
    var im=new Image(); im.decoding="async"; im.src=VIEW.pages[j].src;
  });
}

/* ---------- contained pan + pinch zoom (never the browser's) ---------- */
function applyT(){
  var img=$("#pageimg"); if(!img) return;
  img.style.transform="translate("+VIEW.tx+"px,"+VIEW.ty+"px) scale("+VIEW.scale+")";
}
function resetZoom(){ VIEW.scale=1; VIEW.tx=0; VIEW.ty=0; applyT() }
function clamp(){
  var img=$("#pageimg"), st=$("#stage"); if(!img||!st) return;
  var r=img.getBoundingClientRect(), s=st.getBoundingClientRect();
  var w=img.clientWidth*VIEW.scale, h=img.clientHeight*VIEW.scale;
  var maxX=Math.max(0,(w-s.width)/2), maxY=Math.max(0,(h-s.height)/2);
  VIEW.tx=Math.max(-maxX,Math.min(maxX,VIEW.tx));
  VIEW.ty=Math.max(-maxY,Math.min(maxY,VIEW.ty));
}
function wireZoom(){
  var st=$("#stage"); if(!st) return;
  var pts={}, last=null, startDist=0, startScale=1, lastTap=0;

  st.addEventListener("pointerdown",function(e){
    st.setPointerCapture&&st.setPointerCapture(e.pointerId);
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var k=Object.keys(pts);
    if(k.length===1){
      last={x:e.clientX,y:e.clientY};
      var now=Date.now();
      if(now-lastTap<300){ VIEW.scale = VIEW.scale>1.05 ? 1 : 2.4; VIEW.tx=0; VIEW.ty=0; clamp(); applyT(); }
      lastTap=now;
    } else if(k.length===2){
      var a=pts[k[0]], b=pts[k[1]];
      startDist=Math.hypot(a.x-b.x,a.y-b.y); startScale=VIEW.scale;
    }
  });
  st.addEventListener("pointermove",function(e){
    if(!pts[e.pointerId]) return;
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var k=Object.keys(pts);
    if(k.length===2){
      var a=pts[k[0]], b=pts[k[1]];
      var d=Math.hypot(a.x-b.x,a.y-b.y);
      if(startDist>0){ VIEW.scale=Math.max(1,Math.min(5,startScale*(d/startDist))); clamp(); applyT() }
      e.preventDefault();
    } else if(k.length===1 && VIEW.scale>1.02 && last){
      VIEW.tx+=e.clientX-last.x; VIEW.ty+=e.clientY-last.y;
      last={x:e.clientX,y:e.clientY}; clamp(); applyT(); e.preventDefault();
    }
  });
  function up(e){
    delete pts[e.pointerId];
    if(Object.keys(pts).length<2) startDist=0;
    if(Object.keys(pts).length===0) last=null;
  }
  st.addEventListener("pointerup",up);
  st.addEventListener("pointercancel",up);
  /* No dblclick handler: the pointerdown timer below is the only detector.
     Having both meant a double-click zoomed in and straight back out again. */
  /* swipe between pages only while not zoomed in */
  var sx=null;
  st.addEventListener("pointerdown",function(e){ if(VIEW.scale<1.05) sx=e.clientX });
  st.addEventListener("pointerup",function(e){
    if(sx===null||VIEW.scale>=1.05){ sx=null; return }
    var dx=e.clientX-sx; sx=null;
    if(Math.abs(dx)>60) show(VIEW.i + (dx<0?1:-1));
  });
}

/* ---------- routing ---------- */
function goto(hash){
  if(location.hash===hash || (hash==="#" && !location.hash)){ draw(); return }
  location.hash = hash.replace(/^#/,"");
  if(hash==="#") history.replaceState(null,"",location.pathname+location.search);
  draw();
}
function resolve(){
  var id=(location.hash||"").replace(/^#/,"");
  if(!id) return {kind:"home"};
  for(var i=0;i<D.outlets.length;i++){
    var o=D.outlets[i];
    if(o.id===id) return {kind:"outlet",o:o};
    var m=menuOf(o,id);
    if(m) return pagesOf(id).length ? {kind:"menu",o:o,m:m} : {kind:"outlet",o:o};
  }
  return {kind:"home"};
}
function draw(){
  var r=resolve();
  if(r.kind==="menu")   renderMenu(r.o,r.m);
  else if(r.kind==="outlet") renderOutlet(r.o);
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",draw);
draw();

if(/[?&]view=/.test(location.search)){
  var p=document.createElement("div"); p.className="pill";
  p.textContent=(location.search.match(/view=(\w+)/)[1])+" view (testing override)";
  document.body.appendChild(p);
}
window.__carlton={ goto:goto, resolve:resolve, view:VIEW, show:show };
</script>
