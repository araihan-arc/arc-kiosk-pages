<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Find it in store</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
   font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 html,body{height:100%;background:#eef2ef;overflow:hidden}
 .top{background:linear-gradient(135deg,#00733b,#015c30);color:#fff;padding:16px 20px 14px}
 .top .t{font-size:15px;letter-spacing:.3px;opacity:.9}
 .top .p{font-size:26px;font-weight:800;line-height:1.15;margin-top:3px}
 .chip{display:inline-flex;align-items:center;gap:9px;margin-top:11px;background:#ffc300;color:#11331f;
   padding:8px 16px;border-radius:999px;font-weight:800;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
 .chip .d{font-weight:600;font-size:14px;opacity:.8}
 .mapwrap{position:absolute;left:0;right:0;top:132px;bottom:64px;overflow:hidden;touch-action:none}
 svg{width:100%;height:100%;display:block}
 .foot{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #dfe7e2;
   display:flex;align-items:center;gap:20px;padding:0 20px;font-size:14px;color:#3a4d44;font-weight:600}
 .k{display:flex;align-items:center;gap:8px}
 .sw{width:14px;height:14px;border-radius:50%}
 .btns{position:absolute;right:16px;bottom:80px;display:flex;flex-direction:column;gap:9px}
 .b{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);
   font-size:22px;font-weight:600;color:#11331f}
 .b.sm{font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="top">
  <div class="t">Morrisons Pontefract &middot; here is where to find it</div>
  <div class="p" id="prodLbl">Pepsi Max 2l</div>
  <div class="chip"><span id="aisleLbl">Aisle 3</span><span class="d" id="deptLbl"></span></div>
</div>
<div class="mapwrap"><svg id="map" viewBox="0 0 820 1180" preserveAspectRatio="xMidYMid meet"></svg></div>
<div class="foot">
  <div class="k"><span class="sw" style="background:#1565ff"></span>You are here</div>
  <div class="k"><span class="sw" style="background:#d62828"></span>Your item</div>
  <div class="k"><span class="sw" style="background:#00733b"></span>Walk this way</div>
</div>
<div class="btns"><button class="b" id="zin">+</button><button class="b" id="zout">&minus;</button><button class="b sm" id="zfit">FIT</button></div>
<script>
(function(){
var q=new URLSearchParams(location.search);
var aisle=Math.max(1,Math.min(25,parseInt(q.get('aisle')||'3',10)));
var prod=q.get('product')||'Pepsi Max 2l';

var DEPT={1:['Fruit & Veg','#63b344'],2:['Oven Fresh Bakery','#d99a3e'],3:['Market Street','#c85a5a'],
4:['Salad Bar & Food to Go','#e0913f'],5:['Milk Cheese & Chilled','#5aa9d6'],6:['Fresh Meat & Poultry','#b5484f'],
7:['Fish & Seafood','#4e9fc4'],8:['Frozen Food','#6fb9de'],9:['Desserts','#dd8fb0'],10:['World Foods','#c7a13e'],
11:['Crisps & Snacks','#d1a64e'],12:['Biscuits & Cereal','#cfa152'],13:['Tins Cans & Packets','#c9a24a'],
14:['Cooking & Sauces','#c99a55'],15:['Rice Pasta & Pulses','#c3a05c'],16:['Free From & Dietary','#4fb3a0'],
17:['Soft Drinks & Water','#4a90d9'],18:['Beer Wines & Spirits','#8a6cc4'],19:['Household & Cleaning','#9b7bd0'],
20:['Toiletries & Beauty','#c07bc4'],21:['Baby & Toddler','#e290b4'],22:['Pet Shop','#a9895f'],
23:['Home & Garden','#7fa08c'],24:['Toys & Clothing','#7f97bd'],25:['Cards Books & Stationery','#93a3b8']};

var d=DEPT[aisle]||['','#8a9a92'];
document.getElementById('prodLbl').textContent=prod;
document.getElementById('aisleLbl').textContent='Aisle '+aisle;
document.getElementById('deptLbl').textContent=d[0];
document.title=prod;

var NS='http://www.w3.org/2000/svg',svg=document.getElementById('map');
function el(n,a,txt){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);
  if(txt!==undefined)e.textContent=txt;return e;}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  r=Math.round(r+(255-r)*f);g=Math.round(g+(255-g)*f);b=Math.round(b+(255-b)*f);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

var defs=el('defs');
defs.appendChild((function(){var f=el('filter',{id:'sh',x:'-30%',y:'-30%',width:'170%',height:'170%'});
 f.appendChild(el('feDropShadow',{dx:0,dy:3,stdDeviation:4,'flood-color':'#0b2d1c','flood-opacity':'.22'}));return f;})());
defs.appendChild((function(){var f=el('filter',{id:'pin',x:'-60%',y:'-60%',width:'220%',height:'220%'});
 f.appendChild(el('feDropShadow',{dx:0,dy:4,stdDeviation:5,'flood-color':'#000','flood-opacity':'.35'}));return f;})());
svg.appendChild(defs);

// ---- lantai toko
svg.appendChild(el('rect',{x:24,y:20,width:772,height:1130,rx:26,fill:'#fbfaf6',stroke:'#dfe7e2','stroke-width':2,filter:'url(#sh)'}));
svg.appendChild(el('rect',{x:24,y:20,width:772,height:1130,rx:26,fill:'none',stroke:'#eef2ef','stroke-width':10}));

// ---- Market Street lengkung di atas
var msY=54;
svg.appendChild(el('path',{d:'M 56 '+(msY+70)+' Q 410 '+(msY-18)+' 764 '+(msY+70)+' L 764 '+(msY+96)+' Q 410 '+(msY+10)+' 56 '+(msY+96)+' Z',
  fill:'#f3dede',stroke:'#e2bcbc','stroke-width':1.5}));
svg.appendChild(el('text',{x:410,y:msY+58,'text-anchor':'middle','font-size':19,'font-weight':'800',fill:'#a54a4a'},'MARKET STREET'));
svg.appendChild(el('text',{x:410,y:msY+80,'text-anchor':'middle','font-size':14,fill:'#b06a6a'},'butcher  ·  fishmonger  ·  deli  ·  oven fresh'));

// ---- lorong horizontal
var top=182, h=27, gap=8.4, xL=112, xR=712;
function ay(i){return top+(i-1)*(h+gap);}
for(var i=1;i<=25;i++){
  var Y=ay(i), c=(DEPT[i]||['','#95a5a0'])[1], on=(i===aisle);
  svg.appendChild(el('rect',{x:xL,y:Y,width:xR-xL,height:h,rx:9,
    fill:on?c:shade(c,.72),stroke:on?shade(c,-0):shade(c,.45),'stroke-width':on?2.5:1,
    filter:on?'url(#sh)':''}));
  svg.appendChild(el('rect',{x:xL+4,y:Y+3,width:xR-xL-8,height:7,rx:3.5,fill:'#fff',opacity:on?.38:.55}));
  svg.appendChild(el('text',{x:xL-14,y:Y+19,'text-anchor':'end','font-size':on?20:15,
    'font-weight':on?'800':'700',fill:on?c:'#9aa8a2'},i));
  svg.appendChild(el('text',{x:xL+16,y:Y+19,'font-size':on?15:12.5,'font-weight':on?'800':'600',
    fill:on?'#20321f':'#7d8d86'},(DEPT[i]||[''])[0]));
}

// ---- kasir, pintu masuk, customer service
var by=ay(25)+h+26;
svg.appendChild(el('rect',{x:56,y:by,width:400,height:56,rx:12,fill:'#f0ead6',stroke:'#ddd3b4','stroke-width':1.5}));
svg.appendChild(el('text',{x:256,y:by+34,'text-anchor':'middle','font-size':17,'font-weight':'700',fill:'#7d7143'},'Checkouts'));
svg.appendChild(el('rect',{x:470,y:by,width:140,height:56,rx:12,fill:'#d9eee2',stroke:'#aed4c0','stroke-width':1.5}));
svg.appendChild(el('text',{x:540,y:by+34,'text-anchor':'middle','font-size':17,'font-weight':'800',fill:'#2f7d55'},'Entrance'));
svg.appendChild(el('rect',{x:624,y:by,width:140,height:56,rx:12,fill:'#d9eee2',stroke:'#aed4c0','stroke-width':1.5}));
svg.appendChild(el('text',{x:694,y:by+26,'text-anchor':'middle','font-size':13,'font-weight':'700',fill:'#2f7d55'},'Customer'));
svg.appendChild(el('text',{x:694,y:by+42,'text-anchor':'middle','font-size':13,'font-weight':'700',fill:'#2f7d55'},'Service'));

// ---- rute: kios -> lorong lewat koridor kanan
var KX=540, KY=by-6, DX=xR-42, DY=ay(aisle)+h/2, CORR=xR+28;
var path='M '+KX+' '+KY+' L '+KX+' '+(by-20)+' L '+CORR+' '+(by-20)+' L '+CORR+' '+DY+' L '+DX+' '+DY;
svg.appendChild(el('path',{d:path,fill:'none',stroke:'#00733b','stroke-width':7,'stroke-linecap':'round',
  'stroke-linejoin':'round','stroke-dasharray':'1 15',opacity:'.9'}));

// ---- pin tujuan
svg.appendChild(el('circle',{cx:DX,cy:DY,r:15,fill:'#d62828',stroke:'#fff','stroke-width':4,filter:'url(#pin)'}));
// ---- pin kios
svg.appendChild(el('circle',{cx:KX,cy:KY,r:15,fill:'#1565ff',stroke:'#fff','stroke-width':4,filter:'url(#pin)'}));
var yw=Math.min(190,Math.max(120,('You are here').length*9));
svg.appendChild(el('rect',{x:KX-66,y:KY-52,width:132,height:32,rx:16,fill:'#1565ff',filter:'url(#pin)'}));
svg.appendChild(el('text',{x:KX,y:KY-31,'text-anchor':'middle','font-size':15,'font-weight':'800',fill:'#fff'},'You are here'));

// ---- zoom & geser
var s=1,tx=0,ty=0,g=el('g');
while(svg.childNodes.length>1){ if(svg.childNodes[1].tagName==='defs'){break;} g.appendChild(svg.childNodes[1]); }
svg.appendChild(g);
function ap(){g.setAttribute('transform','translate('+tx+','+ty+') scale('+s+')');}
function zoom(f){var n=Math.max(1,Math.min(4,s*f));tx=410-(410-tx)*(n/s);ty=590-(590-ty)*(n/s);s=n;
  if(s<=1.01){s=1;tx=0;ty=0;}ap();}
document.getElementById('zin').onclick=function(){zoom(1.5)};
document.getElementById('zout').onclick=function(){zoom(1/1.5)};
document.getElementById('zfit').onclick=function(){s=1;tx=0;ty=0;ap()};
var dn=false,px=0,py=0;
svg.addEventListener('pointerdown',function(e){dn=true;px=e.clientX;py=e.clientY;svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',function(e){if(!dn||s<=1)return;tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;ap()});
svg.addEventListener('pointerup',function(){dn=false});
})();
</script>
</body>
</html>
