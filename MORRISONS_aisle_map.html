<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Find it in store</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
   font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 html,body{height:100%;background:#f2f5f3;overflow:hidden}
 .bar{background:#00733b;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
 .bar .t{font-size:19px;font-weight:700;line-height:1.2}
 .bar .s{font-size:13px;opacity:.85}
 .dest{background:#ffc300;color:#11331f;padding:12px 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
 .dest b{font-size:20px}
 .dest span{font-size:15px;font-weight:600}
 .stage{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;touch-action:none}
 .wrapmap{position:absolute;inset:0;top:118px;bottom:74px;overflow:hidden}
 svg{width:100%;height:100%;display:block;touch-action:none}
 .legend{position:absolute;left:0;right:0;bottom:0;height:74px;background:#fff;border-top:1px solid #dde5e0;
   display:flex;align-items:center;gap:22px;padding:0 18px;font-size:14px;color:#33463c}
 .k{display:flex;align-items:center;gap:8px}
 .sw{width:16px;height:16px;border-radius:50%}
 .btns{position:absolute;right:14px;bottom:88px;display:flex;flex-direction:column;gap:9px}
 .b{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);
   font-size:21px;font-weight:600;color:#11331f}
 .b.sm{font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="bar">
  <div>
    <div class="t" id="hdr">Here is where to find it</div>
    <div class="s">Morrisons Pontefract &middot; Stuart Road</div>
  </div>
</div>
<div class="dest"><b id="aisleLbl">Aisle 3</b><span id="prodLbl">Pepsi Max 2l</span></div>
<div class="wrapmap"><svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg></div>
<div class="legend">
  <div class="k"><span class="sw" style="background:#0a66ff"></span>You are here</div>
  <div class="k"><span class="sw" style="background:#e03131"></span><span id="legDest">Your item</span></div>
  <div class="k"><span class="sw" style="background:#00733b"></span>Walking route</div>
</div>
<div class="btns">
  <button class="b" id="zin">+</button><button class="b" id="zout">&minus;</button><button class="b sm" id="zfit">FIT</button>
</div>
<script>
(function(){
 var q=new URLSearchParams(location.search);
 var aisle=parseInt(q.get('aisle')||'3',10);
 var prod=q.get('product')||'Pepsi Max 2l';
 var area=q.get('area')||'';
 document.getElementById('prodLbl').textContent=prod;
 document.getElementById('legDest').textContent=prod;
 document.getElementById('aisleLbl').textContent=area?area:('Aisle '+aisle);
 document.title=prod;

 var NA=25, x0=90, w=34, gap=34.5, yTop=120, yBot=470;
 var svg=document.getElementById('map'), NS='http://www.w3.org/2000/svg';
 function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
 function cx(i){return x0+(i-1)*gap;}

 // lantai
 svg.appendChild(el('rect',{x:40,y:70,width:920,height:470,rx:16,fill:'#ffffff',stroke:'#cdd8d2','stroke-width':2}));
 // market street atas
 svg.appendChild(el('rect',{x:60,y:82,width:880,height:30,rx:8,fill:'#e7f1ea'}));
 var ms=el('text',{x:500,y:102,'text-anchor':'middle','font-size':15,fill:'#3d5c4c','font-weight':'600'});ms.textContent='Market Street — butcher, fish, deli';svg.appendChild(ms);
 // kasir bawah
 svg.appendChild(el('rect',{x:60,y:488,width:640,height:38,rx:8,fill:'#f0eee0'}));
 var ck=el('text',{x:380,y:512,'text-anchor':'middle','font-size':15,fill:'#6a6449','font-weight':'600'});ck.textContent='Checkouts';svg.appendChild(ck);
 // pintu masuk + customer service
 svg.appendChild(el('rect',{x:712,y:488,width:110,height:38,rx:8,fill:'#d9ebe0'}));
 var en=el('text',{x:767,y:512,'text-anchor':'middle','font-size':14,fill:'#2f5c44','font-weight':'700'});en.textContent='Entrance';svg.appendChild(en);
 svg.appendChild(el('rect',{x:832,y:488,width:108,height:38,rx:8,fill:'#d9ebe0'}));
 var cs=el('text',{x:886,y:508,'text-anchor':'middle','font-size':12,fill:'#2f5c44','font-weight':'700'});cs.textContent='Customer';svg.appendChild(cs);
 var cs2=el('text',{x:886,y:521,'text-anchor':'middle','font-size':12,fill:'#2f5c44','font-weight':'700'});cs2.textContent='Service';svg.appendChild(cs2);

 // lorong
 for(var i=1;i<=NA;i++){
   var X=cx(i), hit=(i===aisle);
   svg.appendChild(el('rect',{x:X-w/2,y:yTop,width:w,height:yBot-yTop,rx:7,
     fill:hit?'#ffe9e9':'#eef3f0',stroke:hit?'#e03131':'#dbe4df','stroke-width':hit?2.5:1}));
   var t=el('text',{x:X,y:yTop-9,'text-anchor':'middle','font-size':hit?16:13,
     fill:hit?'#e03131':'#8a9a92','font-weight':hit?'700':'500'});
   t.textContent=i; svg.appendChild(t);
 }
 // titik kios
 var KX=767, KY=470;
 // tujuan
 var DX=cx(aisle), DY=(yTop+yBot)/2;
 // rute
 var d='M '+KX+' '+KY+' L '+KX+' '+(yBot+4)+' L '+(DX)+' '+(yBot+4)+' L '+DX+' '+DY;
 svg.appendChild(el('path',{d:d,fill:'none',stroke:'#00733b','stroke-width':5,'stroke-linecap':'round',
   'stroke-dasharray':'2 13','stroke-linejoin':'round',opacity:'.95'}));
 // pin kios
 svg.appendChild(el('circle',{cx:KX,cy:KY,r:13,fill:'#0a66ff',stroke:'#fff','stroke-width':3}));
 var yh=el('text',{x:KX,y:KY-24,'text-anchor':'middle','font-size':15,fill:'#0a66ff','font-weight':'700'});
 yh.textContent='You are here'; svg.appendChild(yh);
 // pin tujuan
 svg.appendChild(el('circle',{cx:DX,cy:DY,r:15,fill:'#e03131',stroke:'#fff','stroke-width':3}));
 var pill=el('rect',{x:DX-105,y:DY-58,width:210,height:34,rx:17,fill:'#e03131'});
 var lbl=el('text',{x:DX,y:DY-35,'text-anchor':'middle','font-size':15,fill:'#fff','font-weight':'700'});
 lbl.textContent=prod.length>26?prod.slice(0,25)+'…':prod;
 if(DX<150){pill.setAttribute('x',DX-60);lbl.setAttribute('x',DX+45);}
 if(DX>850){pill.setAttribute('x',DX-150);lbl.setAttribute('x',DX-45);}
 svg.appendChild(pill); svg.appendChild(lbl);

 // zoom sederhana
 var s=1,tx=0,ty=0,g=null;
 function wrapG(){
   g=el('g',{}); while(svg.firstChild){g.appendChild(svg.firstChild);} svg.appendChild(g);
 }
 wrapG();
 function apply(){g.setAttribute('transform','translate('+tx+','+ty+') scale('+s+')');}
 function zoom(f){var ns=Math.max(1,Math.min(4,s*f));
   tx=500-(500-tx)*(ns/s); ty=310-(310-ty)*(ns/s); s=ns;
   if(s<=1){tx=0;ty=0;} apply();}
 document.getElementById('zin').onclick=function(){zoom(1.5);};
 document.getElementById('zout').onclick=function(){zoom(1/1.5);};
 document.getElementById('zfit').onclick=function(){s=1;tx=0;ty=0;apply();};
 var px=0,py=0,down=false;
 svg.addEventListener('pointerdown',function(e){down=true;px=e.clientX;py=e.clientY;svg.setPointerCapture(e.pointerId);});
 svg.addEventListener('pointermove',function(e){if(!down||s<=1)return;
   tx+=e.clientX-px; ty+=e.clientY-py; px=e.clientX; py=e.clientY; apply();});
 svg.addEventListener('pointerup',function(e){down=false;});
})();
</script>
</body>
</html>
