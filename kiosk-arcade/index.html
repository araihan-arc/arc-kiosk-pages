<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<title>Kiosk Arcade</title>
<style>
:root{--x:#ff4d6d;--o:#3be0ff;--fg:#e8ecff;--muted:#9aa6d6;
  --font:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--fg);font-family:var(--font);
  background:radial-gradient(1200px 700px at 85% -10%,#1d2363 0%,transparent 60%),
             radial-gradient(1000px 700px at -5% 110%,#3b1442 0%,transparent 60%),#05060f;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.nocursor,body.nocursor *{cursor:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
svg{display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(14px,env(safe-area-inset-top)) max(14px,3vmin) 6px}
.topbar h2{margin:0;font-size:clamp(18px,3.4vmin,32px);letter-spacing:.14em;font-weight:800}
.row{display:flex;gap:12px}
.iconbtn{width:clamp(52px,8vmin,76px);height:clamp(52px,8vmin,76px);border-radius:18px;flex:none;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;transition:transform .08s}
.iconbtn svg{width:52%;height:52%}
.iconbtn:active{transform:scale(.9);background:rgba(255,255,255,.18)}
.iconbtn .off{display:none}.iconbtn.muted .on{display:none}.iconbtn.muted .off{display:block}

/* ---------- HOME ---------- */
.home-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4.5vmin,56px);padding:0 4vmin 6vmin;min-height:0}
.logo{margin:0;text-align:center;font-size:clamp(40px,min(12vw,13vh),150px);font-weight:900;letter-spacing:.14em;line-height:1;
  background:linear-gradient(90deg,#ff6a2b,#ffd36b 40%,#3be0ff 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:-1vmin 0 0;color:var(--muted);font-size:clamp(14px,2.6vmin,26px);letter-spacing:.32em;animation:blink 2.2s ease-in-out infinite}
.cards{display:flex;gap:clamp(16px,4.5vmin,56px);flex-wrap:wrap;justify-content:center}
.card{width:clamp(150px,min(27vw,46vh),470px);aspect-ratio:4/5;border-radius:30px;padding:clamp(16px,3vmin,32px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vmin,18px);
  background:linear-gradient(160deg,rgba(45,58,150,.6),rgba(14,17,48,.85));border:2px solid rgba(130,150,255,.4);
  box-shadow:0 14px 50px rgba(0,0,0,.45),inset 0 0 50px rgba(90,110,255,.14);transition:transform .1s}
.card.r{background:linear-gradient(160deg,rgba(150,60,30,.55),rgba(30,14,30,.85));border-color:rgba(255,138,61,.5);box-shadow:0 14px 50px rgba(0,0,0,.45),inset 0 0 50px rgba(255,120,60,.14)}
.card:active{transform:scale(.95)}
.card .ic{width:64%;animation:float 4s ease-in-out infinite}
.card.r .ic{animation-delay:-2s}.card.g .ic{animation-delay:-1s}
.card.g{background:linear-gradient(160deg,rgba(40,120,60,.55),rgba(12,30,18,.85));border-color:rgba(125,255,155,.45);box-shadow:0 14px 50px rgba(0,0,0,.45),inset 0 0 50px rgba(110,220,120,.14)}
.card b{font-size:clamp(16px,3.4vmin,38px);letter-spacing:.1em}
.card small{color:var(--muted);font-size:clamp(12px,2vmin,18px);letter-spacing:.05em;text-align:center}
.card .play{margin-top:.6vmin;padding:.55em 1.6em;border-radius:99px;background:#fff;color:#0a0d26;font-weight:900;letter-spacing:.14em;font-size:clamp(13px,2.1vmin,20px)}

/* ---------- TIC-TAC-TOE ---------- */
.ttt-wrap{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vmin,64px);padding:0 4vmin 4vmin;min-height:0}
.bwrap{--bs:min(calc(100vh - 130px),52vw,700px);width:var(--bs);height:var(--bs);position:relative;flex:none}
.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,1.5vmin,16px)}
.cell{background:linear-gradient(160deg,#141a48,#0a0d27);border:1px solid rgba(120,140,255,.22);border-radius:clamp(12px,2.2vmin,24px);
  display:grid;place-items:center;transition:transform .08s,background .2s}
.cell:active{transform:scale(.94)}
.cell.win{animation:winpulse .7s ease-in-out infinite alternate}
.mark{width:82%;height:82%;overflow:visible}
.mark *{fill:none;stroke-width:11;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .28s ease-out forwards}
.mark.x *{stroke:var(--x)}.mark.o *{stroke:var(--o)}
.mark.x{filter:drop-shadow(0 0 7px rgba(255,77,109,.7))}.mark.o{filter:drop-shadow(0 0 7px rgba(59,224,255,.7))}
.winline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#winLine{stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
#winLine.show{opacity:1;animation:draw .45s .12s ease-out forwards}
.panel{display:flex;flex-direction:column;gap:clamp(10px,2vmin,22px);width:min(92vw,470px)}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:5px;gap:5px}
.seg button{flex:1;padding:clamp(11px,1.9vmin,19px) 4px;border-radius:13px;font-weight:800;font-size:clamp(12px,2vmin,18px);letter-spacing:.06em;color:#aab4e0}
.seg button.on{background:linear-gradient(135deg,#3b5bff,#7a3bff);color:#fff;box-shadow:0 4px 18px rgba(90,80,255,.4)}
.scores{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sc{background:rgba(255,255,255,.05);border-radius:18px;padding:clamp(8px,1.6vmin,16px) 4px;text-align:center;border:1px solid rgba(255,255,255,.1)}
.sc span{display:block;font-size:clamp(10px,1.6vmin,15px);letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.sc b{display:block;font-size:clamp(30px,6.4vmin,60px);line-height:1.1}
.sc.x b{color:var(--x)}.sc.o b{color:var(--o)}
.bump{animation:bump .45s}
.status{font-size:clamp(18px,3.4vmin,32px);font-weight:800;text-align:center;min-height:1.5em;display:flex;align-items:center;justify-content:center;gap:.4em}
.status i{font-style:normal;display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:10px;font-size:.85em}
.status i.tX{background:rgba(255,77,109,.2);color:var(--x)}.status i.tO{background:rgba(59,224,255,.2);color:var(--o)}
.btn{flex:1;padding:clamp(15px,2.3vmin,23px) 8px;border-radius:18px;font-weight:900;letter-spacing:.1em;font-size:clamp(14px,2.2vmin,20px);
  background:linear-gradient(135deg,#ff6a2b,#ff3d77);color:#fff;box-shadow:0 6px 24px rgba(255,80,80,.3);transition:transform .08s}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.btn:active{transform:scale(.95)}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
@media (orientation:portrait){
  .ttt-wrap{flex-direction:column;justify-content:center;padding-top:1vmin}
  .bwrap{--bs:min(92vw,calc(100vh - 440px),700px)}
}

/* ---------- ORBIT RUN ---------- */
#game,#rgame{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.otop{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.otop .iconbtn{pointer-events:auto;background:rgba(5,8,22,.55)}
.pads{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;align-items:flex-end;
  padding:0 max(16px,3vmin) max(16px,env(safe-area-inset-bottom),3vmin);pointer-events:none;z-index:2}
.pad{display:flex;gap:max(12px,2.4vmin);align-items:flex-end;pointer-events:auto}
.ctl{--s:clamp(78px,14vmin,140px);width:var(--s);height:var(--s);border-radius:50%;flex:none;
  background:rgba(10,14,40,.55);border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;
  font-weight:900;letter-spacing:.06em;font-size:calc(var(--s)*.16);color:#fff;touch-action:none;transition:transform .05s,background .05s,opacity .2s}
.ctl svg{width:46%;height:46%}
.ctl.on{transform:scale(.9);background:rgba(255,255,255,.25)}
.ctl.burn{--s:clamp(96px,18vmin,176px);background:rgba(255,106,43,.25);border-color:#ff8a3d;box-shadow:0 0 28px rgba(255,106,43,.35)}
.ctl.burn.on{background:rgba(255,106,43,.6)}
.ctl.fire{--s:clamp(96px,18vmin,176px);background:rgba(59,224,255,.2);border-color:#3be0ff;box-shadow:0 0 28px rgba(59,224,255,.3)}
.ctl.fire.on{background:rgba(59,224,255,.55)}
.ctl.dim{opacity:.3}
.ctl.pulse{animation:pulse .9s ease-in-out infinite}
#orbit.hidectl .pads{display:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,4,12,.75);z-index:20}
.overlay.hidden{display:none}
.ibox{background:linear-gradient(160deg,#121848,#0a0d27);border:2px solid #3be0ff;border-radius:28px;padding:clamp(18px,4vmin,44px) clamp(20px,5vmin,56px);text-align:center;box-shadow:0 0 70px rgba(59,224,255,.28)}
.ibox h3{margin:0;font-size:clamp(24px,5vmin,48px);color:#ffd36b;letter-spacing:.08em}
.ibox p{margin:.6vmin 0 0;color:var(--muted);letter-spacing:.12em;font-size:clamp(13px,2.2vmin,20px)}
.ibox .iscore{font-size:clamp(28px,6vmin,58px);font-weight:900;margin-top:1vmin}
.islots{display:flex;gap:clamp(12px,3vmin,36px);justify-content:center;margin:clamp(12px,3vmin,30px) 0}
.islot{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vmin,12px)}
.islot b{font-size:clamp(50px,11vmin,110px);width:1.2em;line-height:1.15;border-bottom:5px solid #3a4270;cursor:pointer}
.islot.active b{color:#ffd36b;border-color:#ffd36b}
.ib{width:clamp(60px,10vmin,100px);height:clamp(50px,8vmin,80px);border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.ib svg{width:40%;height:40%}
.ib:active{background:rgba(255,255,255,.25);transform:scale(.94)}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes winpulse{from{background:#141a48}to{background:#2b3690;transform:scale(1.03)}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes blink{50%{opacity:.35}}
@keyframes float{50%{transform:translateY(-6%)}}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 50px rgba(255,138,61,.8)}}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- ================= HOME ================= -->
<section id="home" class="screen active">
  <div class="topbar">
    <div></div>
    <div class="row">
      <button class="iconbtn" data-act="sound" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
      <button class="iconbtn" data-act="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="home-main">
    <h1 class="logo">ARCADE</h1>
    <p class="tag">TAP A GAME TO PLAY</p>
    <div class="cards">
      <button class="card" data-go="ttt">
        <svg class="ic" viewBox="0 0 120 120"><g stroke="#8c9cff" stroke-width="5" stroke-linecap="round" opacity=".7"><path d="M44 12v96M76 12v96M12 44h96M12 76h96"/></g><g stroke="#ff4d6d" stroke-width="8" stroke-linecap="round"><path d="M18 18l18 18M36 18L18 36M84 84l18 18M102 84l-18 18"/></g><circle cx="60" cy="60" r="10" fill="none" stroke="#3be0ff" stroke-width="8"/><circle cx="93" cy="27" r="10" fill="none" stroke="#3be0ff" stroke-width="8"/></svg>
        <b>TIC-TAC-TOE</b><small>vs CPU or a friend</small><span class="play">PLAY</span>
      </button>
      <button class="card r" data-go="orbit">
        <svg class="ic" viewBox="0 0 120 120"><defs><linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#7d848f"/><stop offset=".4" stop-color="#eef1f5"/><stop offset="1" stop-color="#6b717b"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c8"/><stop offset=".4" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/></linearGradient></defs><path d="M52 92q8 26 8 26q0 0 8-26z" fill="url(#fl)"/><path d="M50 92V30q0-20 10-24q10 4 10 24v62z" fill="url(#st)"/><path d="M50 40q-10 6-10 16l10-4zM70 40q10 6 10 16l-10-4zM50 78l-10 14h10zM70 78l10 14H70z" fill="#2a2f3a"/><circle cx="23" cy="26" r="2" fill="#fff"/><circle cx="98" cy="18" r="1.6" fill="#fff"/><circle cx="104" cy="70" r="2" fill="#fff"/><circle cx="16" cy="78" r="1.5" fill="#fff"/></svg>
        <b>ORBIT RUN</b><small>Launch &middot; Catch &middot; Reach orbit</small><span class="play">PLAY</span>
      </button>
      <button class="card g" data-go="runner">
        <svg class="ic" viewBox="0 0 120 120"><circle cx="18" cy="34" r="16" fill="#2a6b30"/><circle cx="104" cy="30" r="16" fill="#1f5a2a"/><path d="M50 30h20l38 88H12z" fill="#b89a66"/><path d="M50 30h3L26 118H12zM67 30h3l38 88H94z" fill="#6f5a3a"/><rect x="28" y="44" width="9" height="42" fill="#857a68"/><rect x="83" y="44" width="9" height="42" fill="#857a68"/><rect x="23" y="38" width="74" height="12" rx="2" fill="#a39985"/><path d="M36 50v8M48 50v12M72 50v10M84 50v7" stroke="#4f9a3a" stroke-width="3" stroke-linecap="round"/><ellipse cx="60" cy="74" rx="6" ry="8" fill="#ffd36b" stroke="#c98a1b" stroke-width="2"/><ellipse cx="60" cy="96" rx="7" ry="9" fill="#ffd36b" stroke="#c98a1b" stroke-width="2"/></svg>
        <b>JUNGLE DASH</b><small>Swipe &middot; Jump &middot; Slide</small><span class="play">PLAY</span>
      </button>
    </div>
  </div>
</section>

<!-- ================= TIC-TAC-TOE ================= -->
<section id="ttt" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-act="home" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>TIC-TAC-TOE</h2>
    <button class="iconbtn" data-act="sound" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
  </div>
  <div class="ttt-wrap">
    <div class="bwrap">
      <div class="board" id="board">
        <button class="cell"></button><button class="cell"></button><button class="cell"></button>
        <button class="cell"></button><button class="cell"></button><button class="cell"></button>
        <button class="cell"></button><button class="cell"></button><button class="cell"></button>
      </div>
      <svg class="winline" viewBox="0 0 300 300"><line id="winLine" pathLength="1" x1="0" y1="0" x2="0" y2="0"/></svg>
    </div>
    <div class="panel">
      <div class="seg" id="modeSeg"><button data-mode="1" class="on">1 PLAYER</button><button data-mode="2">2 PLAYERS</button></div>
      <div class="seg" id="diffSeg"><button data-diff="0">EASY</button><button data-diff="1" class="on">NORMAL</button><button data-diff="2">IMPOSSIBLE</button></div>
      <div class="scores">
        <div class="sc x"><span id="lblX">YOU (X)</span><b id="scX">0</b></div>
        <div class="sc d"><span>DRAW</span><b id="scD">0</b></div>
        <div class="sc o"><span id="lblO">CPU (O)</span><b id="scO">0</b></div>
      </div>
      <div class="status" id="tttStatus"></div>
      <div class="row"><button class="btn" id="tttNew">NEW ROUND</button><button class="btn ghost" id="tttReset">RESET SCORES</button></div>
    </div>
  </div>
  <canvas id="confetti"></canvas>
</section>

<!-- ================= ORBIT RUN ================= -->
<section id="orbit" class="screen">
  <canvas id="game"></canvas>
  <div class="otop">
    <button class="iconbtn" data-act="home" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="iconbtn" data-act="sound" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
  </div>
  <div class="pads">
    <div class="pad"><button class="ctl burn" data-k="burn" id="burnBtn"><span id="burnLbl">LAUNCH</span></button></div>
  </div>
</section>

<!-- ================= JUNGLE DASH ================= -->
<section id="runner" class="screen">
  <canvas id="rgame"></canvas>
  <div class="otop">
    <button class="iconbtn" data-act="home" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="iconbtn" data-act="sound" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
  </div>
</section>

  <div id="initials" class="overlay hidden">
    <div class="ibox">
      <h3>NEW HIGH SCORE!</h3>
      <div class="iscore" id="iScore">0</div>
      <p>ENTER YOUR INITIALS</p>
      <div class="islots" id="islots"></div>
      <button class="btn" id="iSave" style="width:100%">SAVE</button>
    </div>
  </div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,k)=>a+(b-a)*k;
const pick=a=>a[(Math.random()*a.length)|0];
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const params=new URLSearchParams(location.search);
if(params.has('nocursor'))document.body.classList.add('nocursor');
const IDLE_MS=(parseInt(params.get('idle'),10)||60)*1000;
const FONT=getComputedStyle(document.documentElement).getPropertyValue('--font');
// Cap the canvas backing store at ~1080p worth of pixels so a 4K 43" panel stays at 60 fps on the RK3588 GPU
const fitDpr=(w,h)=>Math.min(devicePixelRatio||1,2,Math.sqrt(2.2e6/Math.max(1,w*h)));

/* ===================== SOUND (WebAudio synth, no files) ===================== */
const Snd={ctx:null,master:null,noiseBuf:null,rumble:null,on:store.get('arc_sound',true),
  ensure(){
    if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
      try{this.ctx=new AC();}catch(e){return null}
      this.master=this.ctx.createGain();this.master.gain.value=this.on?.5:0;this.master.connect(this.ctx.destination);
      const n=this.ctx.sampleRate,b=this.ctx.createBuffer(1,n,n),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.noiseBuf=b;}
    if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx},

const TTT=(()=>{

  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

              O:'<svg viewBox="0 0 100 100" class="mark o"><circle pathLength="1" cx="50" cy="50" r="25" transform="rotate(-90 50 50)"/></svg>'};
  let b=Array(9).fill(null),turn='X',mode=1,diff=1,over=false,overAt=0,lock=false,starter='O',scores={X:0,O:0,D:0},cpuTimer=0,nextTimer=0;
  function result(bd){for(const[a,c,d]of LINES)if(bd[a]&&bd[a]===bd[c]&&bd[a]===bd[d])return{p:bd[a],line:[a,c,d]};return bd.every(Boolean)?{p:'D'}:null}

    let best=p==='O'?-99:99;for(let i=0;i<9;i++)if(!bd[i]){bd[i]=p;const v=mm(bd,p==='O'?'X':'O',depth+1);bd[i]=null;best=p==='O'?Math.max(best,v):Math.min(best,v)}return best}

    $$('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.mode==='1'));$$('#diffSeg button').forEach(x=>x.classList.toggle('on',x.dataset.diff==='1'));

    if(hearts<=0){const y=st==='orbit'?SHIP_TOP+50:baseY()-170;boom(P.x,y,80,1.7);gameOver('VEHICLE LOST',false)}}
  function hitRect(cx,cy,r,rx,ry,rw,rh){const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh);return(cx-nx)**2+(cy-ny)**2<r*r}
  const baseY=()=>GROUND-30-Math.min(climb,200), scrollY=()=>Math.max(0,climb-200);
  const vmax=()=>Math.max(110,180-level*12);
  const hiTop=()=>hi.length?hi[0].s:0;

  /* ---------- flow ---------- */
  function toTitle(){level=1;score=0;hearts=3;climb=0;vy=0;P.x=460;P.vx=0;parts=[];obs=[];clouds=[];floats=[];msg=null;booster=null;go('title')}
  function newRun(){level=1;score=0;hearts=3;ammo=30;lastRank=-1;Snd.tone(440,.1,'square',.15,880);startLevel()}
  function startLevel(){P.x=460;P.vx=0;bprop=100;climb=0;vy=0;obs=[];clouds=[];shots=[];orbs=[];aliens=[];picks=[];lift=0;cdLast=0;fadeT=.5;phase='ascent';
    go('count');say(level===1?'GET READY':'LEVEL '+level,level===1?'':'Faster aliens, tighter catch','#ffd36b',2,200)}
  function startCatch(){booster={x:rand(80,320),y:-210,vx:rand(-25,25),vy:80,burn:false,caught:false,dead:false};
    bprop=Math.max(bprop,40);parts=[];fadeT=.5;phase='catch';go('catch');say('CATCH THE BOOSTER!','Drag it over the arms · hold BURN to slow','#3be0ff',2.6,200)}
  function startOrbit(){P.x=320;P.vx=0;sprop=100;ammo=level===1?30:Math.min(50,ammo+15);dist=0;distGoal=80+(level-1)*20;
    aliens=[];orbs=[];shots=[];picks=[];alienT=1.5;pickT=4;earth=1;lift=0;fadeT=.5;parts=[];phase='orbit';go('orbit');
    say('REACH ORBIT!','Drag to steer · hold FIRE · grab FUEL','#7dff9b',2.6,300)}
  function caught(dx){const b=booster,v=b.vy;b.caught=true;b.burn=false;b.vy=0;b.vx=0;b.y=C.armY-28;
    const perfect=dx<7&&v<vmax()*.6;const bonus=Math.round((800+bprop*10+(C.tol-dx)*15+(vmax()-v)*3)*level);
    score+=bonus;say(perfect?'PERFECT CATCH!':'BOOSTER CAUGHT!','+'+fmt(bonus),'#7dff9b',2.4,200);Snd.fanfare();
    for(let i=0;i<40;i++)puff(C.x+rand(-60,60),C.armY+rand(-10,10),rand(-120,120),rand(-200,40),rand(.4,1),1,pick(['#7dff9b','#fff','#ffd36b']),0,2);go('caught')}

  function gameOver(reason,ship){overReason=reason;overShip=ship;canRetry=false;overPhase=0;lastRank=-1;Snd.rumbleSet(0);go('over');
    Snd.tone(300,.6,'sawtooth',.16,70)}
  const qualifies=()=>Scores.qualifies('orbit_hi',Math.floor(score));

  function openIni(){go('initials');Initials.show(score,n=>{const r=Scores.add('orbit_hi',n,Math.floor(score));hi=r.list;lastRank=r.rank;canRetry=true;overPhase=1;go('over')})}

  /* ---------- obstacles / enemies ---------- */
  function rockPts(r){const p=[];for(let i=0;i<8;i++){const a=i/8*6.283,rr=r*rand(.7,1.1);p.push([Math.cos(a)*rr,Math.sin(a)*rr])}return p}
  function newObs(t){const o={t,x:rand(50,590),y:-50,vx:0,vy:0,r:18,vr:rand(-3,3),rot:0,ph:rand(0,6)};
    if(t==='bird'){o.vx=rand(-90,90);o.r=17}else if(t==='balloon'){o.vy=-25;o.r=17}
    else if(t==='drone'){o.vx=rand(-70,70);o.r=20}else{o.vx=rand(-50,50);o.vy=rand(10,70);o.r=20;o.pts=rockPts(20)}return o}
  function newAlien(){const r=Math.random(),x=rand(50,590);
    if(r<.55)return{t:'saucer',x,bx:x,y:-30,vy:65+level*12,hp:1,r:24,ph:rand(0,6),shootT:rand(1,2.5),pts:100,hit:0};
    if(r<.85)return{t:'zig',x,y:-30,vx:(Math.random()<.5?-1:1)*(120+level*16),vy:105+level*10,hp:1,r:18,pts:150,hit:0};
    return{t:'rock',x,y:-40,vx:rand(-30,30),vy:75+level*5,hp:2,r:26,rot:0,vr:rand(-2,2),pts:60,hit:0,pp:rockPts(26)}}

  /* ---------- update ---------- */
  function update(dt){
    T+=dt;stT+=dt;inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt*28);flashT=Math.max(0,flashT-dt);fadeT=Math.max(0,fadeT-dt);
    if(msg){msg.life-=dt;if(msg.life<=0)msg=null}
    let starV=0,scrollV=0,rumble=0;
    switch(st){
    case 'title':
      if(Math.random()<dt*4)puff(460+rand(-60,60),GROUND-12,rand(-40,40),rand(-30,-10),rand(1,2),rand(6,10),'#d8dbe2',10,0);
      if(pressed.has('burn'))newRun();break;
    case 'count':{
      const n=3-Math.floor(stT/.7);if(n!==cdLast&&n>0){cdLast=n;Snd.tone(n===1?660:520,.15,'square',.18)}
      rumble=clamp((stT-1.1),0,.6);
      if(stT>1.1)for(let i=0;i<3;i++)puff(P.x+rand(-30,30),GROUND-28,rand(-240,240),rand(-40,10),rand(.9,1.8),rand(10,18),'#d8dbe2',24,0);
      if(stT>=2.1){Snd.tone(880,.4,'square',.18,1760);Snd.noise(1.4,.55,800);go('ascent');say('LIFTOFF!','Drag to dodge · hold BURN to climb faster','#ffd36b',2.4,260)}
      break}
    case 'ascent':case 'stage':{
      const thr=st==='ascent'&&keys.burn&&bprop>0?1:0;
      const vT=st==='stage'?360:(320+level*25)*(thr?1.6:1);
      vy+=(vT-vy)*Math.min(1,dt*(vy<120?.9:1.6));climb+=vy*dt;
      if(st==='ascent'){bprop=Math.max(0,bprop-(2.5+thr*4)*dt);score+=vy*dt*.06*(thr?2:1)}
      steerPlayer(dt,st==='stage'?280:420,40,600);
      rumble=.5+thr*.35;starV=vy*.25;scrollV=vy;const by=baseY();
      puff(P.x+rand(-9,9),by+22,rand(-30,30)-P.vx*.2,rand(90,200),rand(.2,.45),rand(6,10),pick(FIRE),-8,1);
      if(climb<500)puff(P.x+rand(-30,30),by+30,rand(-280,280),rand(-20,20),rand(1,2),rand(12,20),'#d8dbe2',26,0);
      const k=climb/CLIMB_GOAL;cloudT-=dt;
      if(k<.5&&cloudT<=0){cloudT=rand(.45,1);clouds.push({x:rand(-60,700),y:-90,w:rand(90,200),h:rand(26,50),a:rand(.45,.85),f:rand(.9,1.3)})}
      for(const c of clouds)c.y+=vy*1.1*c.f*dt;clouds=clouds.filter(c=>c.y<VH+120);
      spawnT-=dt;
      if(st==='ascent'&&climb>350&&spawnT<=0){spawnT=Math.max(.4,1.05-level*.09)*rand(.7,1.3);obs.push(newObs(k<.33?(Math.random()<.5?'bird':'balloon'):k<.68?'drone':'debris'))}
      for(const o of obs){o.y+=(vy*.8+o.vy)*dt;o.x+=o.vx*dt;o.rot+=o.vr*dt;if(o.x<25||o.x>615)o.vx*=-1;
        if(!o.dead&&inv<=0&&hitRect(o.x,o.y,o.r,P.x-18,by-340,36,340)){o.dead=true;boom(o.x,o.y,16,.6);damage()}}
      obs=obs.filter(o=>!o.dead&&o.y<VH+70);
      if(st==='ascent'&&climb>=CLIMB_GOAL){stage={p:0};go('stage');say('HOT STAGING','Tap STAGE when the needle is in the GREEN','#3be0ff',2.4,260)}
      else if(st==='stage'){
        stage.p=(1-Math.cos(stT*(3+level*.4)))/2;
        if(pressed.has('burn')||stT>4.2){const late=!pressed.has('burn'),d=Math.abs(stage.p-.5);
          let g,bn;if(late){g='TOO LATE';bn=0}else if(d<.06){g='PERFECT!';bn=500}else if(d<.16){g='GOOD';bn=250}else{g='OK';bn=100}
          bn*=level;score+=bn;say(g,bn?'+'+fmt(bn):'Auto-separation','#'+(bn>=500*level?'7dff9b':bn?'ffd36b':'ff7a7a'),1.7,260);
          Snd.tone(bn>=500*level?1046:784,.25,'square',.2);Snd.noise(.6,.5,2600);
          sep={x:P.x,shipTop:by-340,boosterTop:by-200,sv:220,rot:0};
          for(let i=0;i<40;i++)puff(P.x+rand(-22,22),by-200,rand(-260,260),rand(-80,80),rand(.3,.7),rand(4,8),pick(FIRE),-5,1);
          obs=[];go('sep')}}
      break}
    case 'sep':
      rumble=.35;starV=160;scrollV=120;sep.sv+=750*dt;sep.shipTop-=sep.sv*dt;sep.boosterTop+=(40+stT*90)*dt;sep.rot=Math.sin(stT*2.4)*.35*Math.min(1,stT);
      if(sep.shipTop>-220)puff(sep.x+rand(-6,6),sep.shipTop+146,rand(-20,20),rand(140,220),.3,6,pick(FIRE),-6,1);
      for(const c of clouds)c.y+=200*dt;
      if(stT>1.9)startCatch();break;
    case 'catch':{
      const b=booster,s=steerInput(b.x),has=bprop>0,burning=keys.burn&&has;
      b.vx+=s*230*dt*(has?1:0);b.vx*=1-Math.min(1,dt*1.4);
      if(s&&has){bprop=Math.max(0,bprop-5*dt);if(Math.random()<.6)puff(b.x-Math.sign(s)*22,b.y+34,-Math.sign(s)*rand(80,150),rand(-10,10),.35,4,'#e6ecff',10,0)}
      b.vy+=(110+level*6)*dt;if(burning){b.vy-=275*dt;bprop=Math.max(0,bprop-15*dt)}
      if(b.vy<-50)b.vy=-50;b.burn=burning;
      const prev=b.y+28;b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<30){b.x=30;b.vx=0}if(b.x>610){b.x=610;b.vx=0}
      rumble=burning?.7:.08;
      if(burning)puff(b.x+rand(-10,10),b.y+206,rand(-40,40),rand(120,220)+b.vy,rand(.2,.4),rand(6,10),pick(FIRE),-8,1);
      const pin=b.y+28;
      if(prev<C.armY&&pin>=C.armY){const dx=Math.abs(b.x-C.x);
        if(dx<=C.tol){if(b.vy<=vmax()){caught(dx);break}crash('TOO FAST!',b.x,C.armY);break}
        if(b.x+20>C.armTip&&b.x-20<C.towerX1){crash('HIT THE ARMS',b.x,C.armY);break}}
      if(b.x+20>C.towerX0&&b.x-20<C.towerX1&&b.y+200>C.towerTop){crash('HIT THE TOWER',b.x,Math.max(b.y+100,C.towerTop));break}
      if(b.y+200>=C.ground){crash('MISSED THE TOWER',b.x,C.ground-20);break}
      break}
    case 'caught':booster.x+=(C.x-booster.x)*Math.min(1,dt*5);if(stT>2.7)startOrbit();break;
    case 'lost':if(stT>2.5)startOrbit();break;
    case 'orbit':{
      starV=150+level*20;rumble=.22;earth=Math.max(0,earth-dt*.12);
      steerPlayer(dt,480,28,612);
      sprop-=(1.6+level*.15)*dt;dist+=(2+level*.2)*dt;score+=dt*10;
      puff(P.x+rand(-7,7),SHIP_TOP+112,rand(-20,20),rand(160,240),rand(.15,.3),rand(5,8),pick(FIRE),-10,1);
      fireCd-=dt;noAmmoT-=dt;const firing=keys.fire||keys.burn;
      if(firing&&fireCd<=0){if(ammo>0){shots.push({x:P.x,y:SHIP_TOP-4});ammo--;fireCd=.19;Snd.tone(900,.07,'square',.09,420)}
        else if(noAmmoT<=0){noAmmoT=.9;float(P.x,SHIP_TOP-20,'NO AMMO','#ff7a7a');Snd.tone(140,.12,'square',.12);fireCd=.3}}
      alienT-=dt;if(alienT<=0){alienT=Math.max(.35,1.3-level*.12)*rand(.6,1.4);aliens.push(newAlien())}
      pickT-=dt;if(pickT<=0){pickT=rand(3.2,5.2);const r=Math.random();
        picks.push({t:sprop<55&&r<.6?'fuel':r<.45?'fuel':r<.85||hearts>=3?'ammo':'heart',x:rand(50,590),y:-20,ph:rand(0,6)})}
      for(const s of shots)s.y-=780*dt;
      for(const a of aliens){a.hit=Math.max(0,a.hit-dt);
        if(a.t==='saucer'){a.y+=a.vy*dt;a.x=clamp(a.bx+Math.sin(a.ph+T*2)*70,30,610);a.shootT-=dt;
          if(a.shootT<=0&&a.y>40&&a.y<520){a.shootT=Math.max(.9,rand(1.6,3)-level*.1);const dx=P.x-a.x,dy=SHIP_TOP+50-a.y,l=Math.hypot(dx,dy),v=200+level*15;
            orbs.push({x:a.x,y:a.y+10,vx:dx/l*v,vy:dy/l*v});Snd.tone(300,.1,'triangle',.08,500)}}
        else if(a.t==='zig'){a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.x<30||a.x>610){a.vx*=-1;a.x=clamp(a.x,30,610)}}
        else{a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.vr*dt}
        for(const s of shots)if(!s.dead&&(s.x-a.x)**2+(s.y-a.y)**2<(a.r+7)**2){s.dead=true;a.hp--;a.hit=.12;
          if(a.hp<=0){a.dead=true;const p=Math.round(a.pts*(1+(level-1)*.5));score+=p;float(a.x,a.y,'+'+p,'#ffd36b');boom(a.x,a.y,22,.7)}
          else Snd.tone(200,.06,'square',.1)}
        if(!a.dead&&hitRect(a.x,a.y,a.r*.8,P.x-15,SHIP_TOP+6,30,104)){a.dead=true;boom(a.x,a.y,22,.7);damage()}}
      for(const o of orbs){o.x+=o.vx*dt;o.y+=o.vy*dt;if(hitRect(o.x,o.y,6,P.x-14,SHIP_TOP+8,28,100)){o.dead=true;damage()}}
      for(const p of picks){p.y+=115*dt;if(hitRect(p.x,p.y,20,P.x-16,SHIP_TOP,32,110)){p.dead=true;
        if(p.t==='fuel'){sprop=Math.min(100,sprop+35);float(p.x,p.y,'+FUEL','#ff9a3d')}
        else if(p.t==='ammo'){ammo=Math.min(50,ammo+15);float(p.x,p.y,'+AMMO','#3be0ff')}
        else{hearts=Math.min(3,hearts+1);float(p.x,p.y,'+SHIELD','#ff4d6d')}
        score+=25;[660,880,1175].forEach((f,i)=>Snd.tone(f,.08,'square',.1,null,i*.06))}}
      shots=shots.filter(s=>!s.dead&&s.y>-20);aliens=aliens.filter(a=>!a.dead&&a.y<VH+50);
      orbs=orbs.filter(o=>!o.dead&&o.y<VH+20&&o.y>-20&&o.x>-20&&o.x<VW+20);picks=picks.filter(p=>!p.dead&&p.y<VH+30);
      if(sprop<25){warnT-=dt;if(warnT<=0){warnT=.8;Snd.tone(880,.08,'square',.09)}}
      if(st==='orbit'&&sprop<=0){sprop=0;gameOver('OUT OF PROPELLANT',true)}
      else if(st==='orbit'&&dist>=distGoal){const bonus=Math.round(2000*level+sprop*20);score+=bonus;
        say('ORBIT ACHIEVED!','+'+fmt(bonus),'#7dff9b',3,300);Snd.fanfare();level++;hearts=Math.min(3,hearts+1);aliens.forEach(a=>boom(a.x,a.y,10,.5));aliens=[];orbs=[];go('orbitDone')}
      break}
    case 'orbitDone':starV=400;rumble=.3;lift+=dt*(200+stT*500);
      puff(P.x+rand(-7,7),SHIP_TOP+112-lift,rand(-20,20),rand(160,240),.3,7,pick(FIRE),-10,1);
      if(stT>3.2)startLevel();break;
    case 'over':
      if(overPhase===0&&stT>1.3){overPhase=1;if(qualifies())openIni();else{canRetry=true;ui()}}
      if(canRetry&&pressed.has('burn'))newRun();break;
    }
    // particles / floats / stars
    for(const p of parts){p.x+=p.vx*dt;p.y+=(p.vy+scrollV*.85)*dt;p.vx*=1-dt*1.6;p.vy*=1-dt*1.2;p.life-=dt;p.size=Math.max(.5,p.size+p.grow*dt)}
    parts=parts.filter(p=>p.life>0);
    for(const f of floats){f.y-=45*dt;f.life-=dt}floats=floats.filter(f=>f.life>0);
    for(const s of stars){s.y+=starV*s.z*dt/H;if(s.y>1){s.y-=1;s.x=Math.random()}}
    T%=1000;Snd.rumbleSet(running?rumble:0);starStretch=starV;
  }
  let starStretch=0;

  /* ---------- drawing primitives ---------- */
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`, mix=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
  function steel(x,w){const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#757c87');g.addColorStop(.35,'#eef1f5');g.addColorStop(.6,'#c3c9d1');g.addColorStop(1,'#636974');return g}

    const g=ctx.createLinearGradient(0,y,0,y+L);g.addColorStop(0,'rgba(255,250,220,.95)');g.addColorStop(.3,'rgba(255,185,80,.85)');g.addColorStop(1,'rgba(255,70,20,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.quadraticCurveTo(x-w*.4,y+L*.6,x,y+L);ctx.quadraticCurveTo(x+w*.4,y+L*.6,x+w/2,y);ctx.fill();
    ctx.fillStyle='rgba(170,215,255,.7)';ctx.beginPath();ctx.moveTo(x-w*.28,y);ctx.lineTo(x,y+L*.32);ctx.lineTo(x+w*.28,y);ctx.fill();ctx.restore()}
  function drawBooster(cx,top,flameLen,rot){const w=40,h=200,x=cx-w/2;
    ctx.save();if(rot){ctx.translate(cx,top+h/2);ctx.rotate(rot);ctx.translate(-cx,-top-h/2)}
    if(flameLen)flame(cx,top+h+5,w*.85,flameLen);

    ctx.strokeStyle='rgba(0,0,0,.13)';ctx.lineWidth=1;ctx.beginPath();for(let y=top+30;y<top+h;y+=24){ctx.moveTo(x,y);ctx.lineTo(x+w,y)}ctx.stroke();
    ctx.fillStyle='#343944';ctx.fillRect(x,top,w,9);ctx.fillStyle='#ff7a3d';for(let i=0;i<4;i++)ctx.fillRect(x+4+i*9,top+3,5,3);
    ctx.fillStyle='#2a2e37';ctx.fillRect(x-9,top+14,9,15);ctx.fillRect(x+w,top+14,9,15);
    ctx.fillStyle='#596070';ctx.fillRect(x-5,top+25,5,6);ctx.fillRect(x+w,top+25,5,6);
    ctx.fillStyle='#262a32';ctx.fillRect(x+1,top+h-7,w-2,9);
    ctx.fillStyle='#1b1e24';for(let i=0;i<3;i++){const ex=x+7+i*13;ctx.beginPath();ctx.moveTo(ex,top+h+2);ctx.lineTo(ex+8,top+h+2);ctx.lineTo(ex+10,top+h+8);ctx.lineTo(ex-2,top+h+8);ctx.fill()}
    ctx.restore()}
  function drawShip(cx,top,h,flameLen){const w=h*.285,x=cx-w/2,nose=w*1.1,bot=top+h;
    if(flameLen)flame(cx,bot+3,w*.8,flameLen);
    ctx.fillStyle='#1f232b';
    ctx.beginPath();ctx.moveTo(x,bot-h*.22);ctx.lineTo(x-w*.35,bot-2);ctx.lineTo(x,bot-2);ctx.fill();
    ctx.beginPath();ctx.moveTo(x+w,bot-h*.22);ctx.lineTo(x+w*1.35,bot-2);ctx.lineTo(x+w,bot-2);ctx.fill();
    ctx.beginPath();ctx.moveTo(x,top+nose*.75);ctx.lineTo(x-w*.25,top+nose*1.5);ctx.lineTo(x,top+nose*1.5);ctx.fill();
    ctx.beginPath();ctx.moveTo(x+w,top+nose*.75);ctx.lineTo(x+w*1.25,top+nose*1.5);ctx.lineTo(x+w,top+nose*1.5);ctx.fill();
    ctx.save();ctx.beginPath();ctx.moveTo(x,bot);ctx.lineTo(x,top+nose);ctx.quadraticCurveTo(x,top,cx,top);ctx.quadraticCurveTo(x+w,top,x+w,top+nose);ctx.lineTo(x+w,bot);ctx.closePath();
    ctx.fillStyle=steel(x,w);ctx.fill();ctx.clip();ctx.fillStyle='rgba(18,20,26,.93)';ctx.fillRect(x-1,top,w*.44,h);ctx.restore();
    ctx.fillStyle='#262a32';ctx.fillRect(x+w*.12,bot,w*.76,4)}
  function drawTower(x0,x1,top,bottom,armY,armTip,closed){
    ctx.fillStyle='#1d2335';ctx.fillRect(x0,top,x1-x0,bottom-top);

    if(st==='title')panelTitle();
    if(st==='over'||st==='initials')panelOver();
    if(msg&&st==='run'){const k=msg.life/msg.max;ctx.globalAlpha=clamp(Math.min((1-k)*8,k*4),0,1);big(msg.t,H*.3,Math.max(34,u*8),msg.c,msg.s);ctx.globalAlpha=1}
    if(flash>0){ctx.fillStyle=`rgba(255,60,40,${flash})`;ctx.fillRect(0,0,W,H)}}
  const fz=k=>Math.max(k[1],u*k[0]);
  function big(t,y,size,col,sub){ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font=`900 ${size}px ${FONT}`;ctx.lineJoin='round';ctx.lineWidth=size/6;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(t,cx,y);ctx.fillStyle=col;ctx.fillText(t,cx,y);
    if(sub){const fs=Math.max(16,size*.4);ctx.font=`bold ${fs}px ${FONT}`;ctx.lineWidth=fs/4;ctx.strokeText(sub,cx,y+fs*1.5);ctx.fillStyle='#fff';ctx.fillText(sub,cx,y+fs*1.5)}}
  function coinIcon(x,y,r){ctx.fillStyle='#d69a1e';ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(x,y,r*.72,0,6.283);ctx.fill()}
  function hud(){const pw=Math.min(W-2*Math.max(80,u*10),u*72),ph=fz([11,46]),x0=cx-pw/2,y0=Math.max(10,u*1.6);
    ctx.fillStyle='rgba(10,14,20,.55)';rr(x0,y0,pw,ph,ph*.22);ctx.fill();
    const cols=[['DISTANCE',fmt(dist)+' m'],['COINS',String(coins)],['SCORE',fmt(score())]],lf=fz([2,11]),vf=fz([4.4,20]);
    cols.forEach((c,i)=>{const x=x0+pw*(i+.5)/3;ctx.textAlign='center';ctx.font=`bold ${lf}px ${FONT}`;ctx.fillStyle='#c9d6b8';ctx.fillText(c[0],x,y0+ph*.36);
      ctx.font=`900 ${vf}px ${FONT}`;ctx.fillStyle=i===1?'#ffd86b':'#fff';ctx.fillText(c[1],x,y0+ph*.82)})}
  function panel(w,h){const x=cx-w/2,y=Math.max(u*9,(H-h)/2-u*4);ctx.fillStyle='rgba(12,20,12,.82)';rr(x,y,w,h,u*3);ctx.fill();ctx.strokeStyle='rgba(125,255,155,.55)';ctx.lineWidth=Math.max(2,u*.35);ctx.stroke();return[x,y]}
  function arrow(x,y,s,dir){ctx.save();ctx.translate(x,y);ctx.rotate({right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[dir]);
    ctx.fillStyle='#ffd36b';ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(0,-s*.75);ctx.lineTo(0,-s*.3);ctx.lineTo(-s,-s*.3);ctx.lineTo(-s,s*.3);ctx.lineTo(0,s*.3);ctx.lineTo(0,s*.75);ctx.closePath();ctx.fill();ctx.restore()}
  function table(x,y,w,rowH,fs){ctx.textAlign='left';ctx.font=`bold ${fs*.8}px ${FONT}`;ctx.fillStyle='#9fd3a0';ctx.fillText('TOP RUNNERS',x,y);
    if(!hi.length){ctx.font=`bold ${fs}px ${FONT}`;ctx.fillStyle='#e6f0da';ctx.fillText('No scores yet - be first!',x,y+rowH);return}
    hi.forEach((e,i)=>{const yy=y+rowH*(i+1);ctx.font=`bold ${fs}px ${FONT}`;ctx.fillStyle=i===lastRank?'#ffd36b':'#e6f0da';ctx.textAlign='left';ctx.fillText(`${i+1}. ${e.n}`,x,yy);ctx.textAlign='right';ctx.fillText(fmt(e.s),x+w,yy)})}
  function panelTitle(){const w=Math.min(W*.92,u*92),h=Math.min(H*.86,u*86),[x,y]=panel(w,h),pad=w*.07;
    const tf=Math.min(w*.13,u*10);const g=ctx.createLinearGradient(0,y,0,y+tf*1.2);g.addColorStop(0,'#fff0a0');g.addColorStop(1,'#ff9a3d');
    ctx.fillStyle=g;ctx.textAlign='center';ctx.font=`900 ${tf}px ${FONT}`;ctx.fillText('JUNGLE DASH',cx,y+tf*1.15);
    const rf=Math.max(13,Math.min(w*.042,u*3.4)),rows=[['left','right','Swipe left / right to change lane'],['up',null,'Swipe up or tap to jump logs'],['down',null,'Swipe down to slide under arches']];
    let yy=y+tf*1.15+rf*2.6;
    rows.forEach(r=>{const ax=x+pad+rf;arrow(ax,yy-rf*.35,rf*.75,r[0]);if(r[1])arrow(ax+rf*2,yy-rf*.35,rf*.75,r[1]);
      ctx.textAlign='left';ctx.font=`bold ${rf}px ${FONT}`;ctx.fillStyle='#f2f7ea';ctx.fillText(r[2],x+pad+rf*4,yy);yy+=rf*2.1});
    ctx.font=`bold ${rf*.9}px ${FONT}`;ctx.fillStyle='#ffd86b';ctx.fillText('Grab coins: +10 each. One crash ends the run!',x+pad,yy+rf*.2);
    table(x+pad,yy+rf*2.6,w-pad*2,rf*1.6,rf*1.05);
    ctx.globalAlpha=.55+.45*Math.sin(T*5);ctx.textAlign='center';ctx.font=`900 ${rf*1.8}px ${FONT}`;ctx.fillStyle='#7dff9b';ctx.fillText('TAP TO RUN',cx,y+h-rf*1.4);ctx.globalAlpha=1}
  function panelOver(){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
    const w=Math.min(W*.92,u*84),h=Math.min(H*.86,u*82),[x,y]=panel(w,h),pad=w*.08,rf=Math.max(13,Math.min(w*.045,u*3.4));
    big('YOU CRASHED!',y+rf*3.4,Math.min(w*.1,u*8),'#ff6a5a');
    const stats=[['DISTANCE',fmt(dist)+' m'],['COINS',String(coins)],['SCORE',fmt(finalScore)]];
    stats.forEach((s2,i)=>{const sx=x+w*(i+.5)/3;ctx.textAlign='center';ctx.font=`bold ${rf*.8}px ${FONT}`;ctx.fillStyle='#9fd3a0';ctx.fillText(s2[0],sx,y+rf*6);
      ctx.font=`900 ${rf*(i===2?2:1.6)}px ${FONT}`;ctx.fillStyle=i===2?'#fff':i===1?'#ffd86b':'#e6f0da';ctx.fillText(s2[1],sx,y+rf*8.2)});
    table(x+pad,y+rf*11,w-pad*2,rf*1.6,rf*1.05);
    if(canRetry){ctx.globalAlpha=.55+.45*Math.sin(T*5);ctx.textAlign='center';ctx.font=`900 ${rf*1.7}px ${FONT}`;ctx.fillStyle='#7dff9b';ctx.fillText('TAP TO RUN AGAIN',cx,y+h-rf*1.3);ctx.globalAlpha=1}}

  function frame(now){raf=requestAnimationFrame(frame);const dt=Math.min(.034,(now-last)/1000||0);last=now;update(dt);draw()}
  function onResize(){if(running)resize()}
  return{start(){if(running)return;running=true;resize();toTitle();last=performance.now();addEventListener('resize',onResize);raf=requestAnimationFrame(frame)},
    stop(){if(!running)return;if(Initials.isOpen())Initials.save();running=false;cancelAnimationFrame(raf);removeEventListener('resize',onResize);sw.id=null}};
})();

BG.start();
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
