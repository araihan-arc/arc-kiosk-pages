<!-- ============================================================
     Carlton Hotel Singapore · Smart Itinerary

     Two screens, as agreed:
       #screen-ideas  — stage 1, the card list of itineraries (Tanglin / Sentosa shape)
       #screen-plan   — stage 2, the plan card (arc-hotel-itinerary-kiosk design)

     This is the WebView page the ARC kiosk opens through Interactive KM —
     the same kind of page as carlton-dining. It deliberately carries NO avatar,
     microphone or voice sheet: that chrome belongs to the kiosk application.

     Mode is set by class html.k / html.m from ?view=kiosk or ?view=m,
     not by media query, so the parameter genuinely forces a mode.

     Colour comes from carltonhotel.sg computed style, read from the live site:
       #615450 primary text · #372B4F h2 and action background
       #EAE6E3 card background and action text · #C4A397 accent · #D3CFCC rules
     Montserrat is the hotel's own typeface. Newsreader is used for ONE thing,
     the plan name on stage 2, because that is the only place the kiosk needs a
     headline readable from two metres away.
     ============================================================ -->

<style>
:root{
  --ivory:#F7F5F3; --paper:#EAE6E3; --card:#FFFFFF;
  --ink:#4A403C; --ink2:#7B6F6B; --muted:#8C8A88;
  --plum:#372B4F; --plum-d:#2A2039; --blush:#C4A397; --line:#D3CFCC;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:Montserrat,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 2px 10px rgba(55,43,79,.07);
  --shadow-lg:0 14px 38px rgba(55,43,79,.13);
}
*{box-sizing:border-box}
[hidden],.hide{display:none!important}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
img{display:block}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
     gap:16px;background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px}
.brand img{height:34px;width:auto}
.top-note{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-size:11px}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}

/* ---------- stage 1: ideas ---------- */
.lede{margin:4px 0 22px}
.lede h1{margin:0 0 8px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--plum);font-size:24px}
.lede p{margin:0;color:var(--ink2);font-size:15px;line-height:1.55;max-width:60ch}
.ideas{display:grid;gap:16px}
.idea{position:relative;display:flex;overflow:hidden;text-align:left;background:var(--card);
      border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
      transition:transform .16s,box-shadow .16s,border-color .16s}
.idea:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--blush)}
.idea-img{object-fit:cover;background:var(--paper);flex:none}
.idea-icon{position:absolute;background:var(--card);border-radius:10px;display:grid;place-items:center;box-shadow:var(--shadow)}
.idea-body{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;padding:18px 20px}
.idea-t{color:var(--ink);font-weight:600;letter-spacing:.005em}
.idea-bl{color:var(--ink2);font-weight:400;line-height:1.5;flex:1}
.idea-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--plum);font-weight:600}
.dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
.tag-pop{background:var(--blush);color:#3A2B25;border-radius:999px;padding:2px 9px;font-weight:700;letter-spacing:.06em}
.who{color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}

/* ---------- stage 2: plan ---------- */
.phero{position:relative;border-radius:18px;overflow:hidden;background:var(--paper)}
.phero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.phero .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,20,34,.86) 0,rgba(26,20,34,.30) 52%,rgba(26,20,34,.42) 100%)}
.phero .pmark{position:absolute;top:22px;left:24px;z-index:2}
.phero .pmark img{position:static;height:26px;width:auto;object-fit:contain}
.phero .ptxt{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:26px 28px}
.eyebrow{color:#EFE1DB;font-weight:700;letter-spacing:.28em;text-transform:uppercase;margin:0 0 10px}
.phero h1{margin:0;font-family:var(--serif);font-weight:400;color:#fff;line-height:1.08;letter-spacing:.005em}

.pstats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);
        border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden}
.pstat{padding:16px 18px;border-left:1px solid var(--line)}
.pstat:first-child{border-left:0}
.pstat b{display:block;font-weight:600;color:var(--plum)}
.pstat span{color:var(--muted)}

.tl{list-style:none;margin:22px 0 0;padding:0}
.stop{display:grid;grid-template-columns:auto auto 1fr;gap:18px;align-items:start;
      padding:18px 2px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop-when{text-align:right;white-space:nowrap}
.stop-when b{display:block;color:var(--plum);font-weight:600}
.stop-when span{color:var(--blush);font-weight:700;letter-spacing:.18em}
.stop-img{object-fit:cover;border-radius:10px;background:var(--paper)}
.stop.nopic{grid-template-columns:auto 1fr}
.stop-body{min-width:0}
.stop-body h3{margin:0 0 5px;font-weight:600;color:var(--ink);line-height:1.25}
.stop-why{margin:0 0 7px;color:var(--ink2);line-height:1.5}
.stop-sub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted)}
.stop-hrs{margin:7px 0 0;color:var(--ink2);line-height:1.45}
.stop-hrs b{color:var(--plum);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.btn{display:inline-block;margin-top:11px;background:var(--plum);color:var(--paper);
     border-radius:999px;text-decoration:none;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.btn:hover{background:var(--plum-d)}
.btn-ghost{background:none;color:var(--plum);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--paper)}

.qrblock{display:flex;gap:28px;align-items:center;margin-top:26px;padding:26px;
         background:var(--paper);border-radius:16px}
.qrbox{background:#fff;padding:12px;border-radius:12px;flex:none;line-height:0}
.qrbox img,.qrbox canvas{display:block}
.qr-e{color:var(--plum);font-weight:700;letter-spacing:.24em;text-transform:uppercase;margin:0 0 8px}
.qr-t{margin:0 0 8px;font-family:var(--serif);font-weight:400;color:var(--ink);line-height:1.15}
.qr-p{margin:0;color:var(--ink2);line-height:1.5}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:12px;align-items:center;
     background:var(--card);border-top:1px solid var(--line);padding:12px 20px;
     padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.bar .spacer{flex:1}

/* ---------- sheet: ganti rencana ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex}
.sheet-back{position:absolute;inset:0;background:rgba(26,20,34,.52)}
.sheet-panel{position:relative;background:var(--ivory);display:flex;flex-direction:column;
             margin-left:auto;width:min(560px,100%);box-shadow:-18px 0 50px rgba(26,20,34,.26)}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
            padding:20px 22px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-head h2{margin:0;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--plum)}
.sheet-x{color:var(--ink2);line-height:1;padding:4px 8px;border-radius:8px}
.sheet-x:hover{background:var(--paper)}
.chips{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;background:var(--card);
       border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink2);
      background:var(--ivory);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--paper);font-weight:600}
.sheet-body{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 22px 28px;display:grid;gap:12px;align-content:start;grid-auto-rows:min-content}
.pc{display:flex;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.pc:hover{border-color:var(--blush)}
.pc img{width:108px;min-height:96px;object-fit:cover;background:var(--paper);flex:none;align-self:stretch}
.pc-b{padding:13px 14px 14px;min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.pc-t{font-weight:600;color:var(--ink);line-height:1.25}
.pc-bl{color:var(--ink2);line-height:1.45}
.pc-m{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--plum);font-weight:600}
.pc.cur{background:var(--paper);border-color:var(--blush);cursor:default}
.pc.cur:hover{border-color:var(--blush)}
.pc-now{color:var(--blush);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.sheet-none{color:var(--ink2);padding:18px 2px}

/* ---------- kiosk ---------- */
html.k{font-size:17px}
html.k .top{padding:18px 30px}
html.k .brand img{height:44px}
html.k .wrap{max-width:none;padding:30px 36px 110px}
html.k .lede h1{font-size:34px}
html.k .lede p{font-size:19px}
html.k .ideas{grid-template-columns:1fr}
html.k .idea{flex-direction:row}
html.k .idea-img{width:290px;height:190px}
html.k .idea-icon{top:18px;left:18px;width:50px;height:50px;font-size:24px}
html.k .idea-body{padding:24px 26px;gap:7px}
html.k .idea-t{font-size:27px}
html.k .idea-bl{font-size:17px}
html.k .idea-meta{font-size:15px;padding-top:2px}
html.k .phero{height:340px}
html.k .phero h1{font-size:54px}
html.k .eyebrow{font-size:14px}
html.k .pstat b{font-size:30px}
html.k .pstat span{font-size:15px}
html.k .stop-img{width:190px;height:130px}
html.k .stop-when b{font-size:24px}
html.k .stop-when span{font-size:13px}
html.k .stop-body h3{font-size:26px}
html.k .stop-why{font-size:17px}
html.k .stop-sub{font-size:15px}
html.k .stop-hrs{font-size:15px}
html.k .stop-hrs b{font-size:12px}
html.k .btn{padding:11px 22px;font-size:14px}
html.k .qr-t{font-size:34px}
html.k .qr-p{font-size:17px}
html.k .qr-e{font-size:13px}
html.k .sheet-head h2{font-size:21px}
html.k .sheet-x{font-size:30px}
html.k .chip{font-size:15px}
html.k .pc img{width:132px}
html.k .pc-t{font-size:21px}
html.k .pc-bl{font-size:15px}
html.k .pc-m,html.k .pc-now{font-size:13px}
html.k .sheet-panel{width:min(640px,100%)}

/* ---------- phone ---------- */
html.m{font-size:16px}
html.m .wrap{padding:18px 16px 96px}
html.m .lede h1{font-size:20px}
html.m .lede p{font-size:14px}
html.m .ideas{grid-template-columns:1fr;gap:12px}
html.m .idea{flex-direction:column}
html.m .idea-img{width:100%;height:124px}
html.m .idea-icon{top:12px;left:12px;width:38px;height:38px;font-size:18px}
html.m .idea-body{padding:14px 16px}
html.m .idea-t{font-size:18px}
html.m .idea-bl{font-size:14px}
html.m .idea-meta{font-size:12.5px}
html.m .phero{height:210px;border-radius:14px}
html.m .phero .ptxt{padding:18px}
html.m .phero h1{font-size:30px}
html.m .eyebrow{font-size:10.5px;letter-spacing:.22em}
html.m .pstats{grid-template-columns:repeat(3,1fr)}
html.m .pstat{padding:12px}
html.m .pstat b{font-size:18px}
html.m .pstat span{font-size:11.5px}
html.m .stop{gap:12px;padding:14px 0}
html.m .stop-img{width:84px;height:84px}
html.m .stop-when b{font-size:15px}
html.m .stop-when span{font-size:10px}
html.m .stop-body h3{font-size:17px}
html.m .stop-why{font-size:14px}
html.m .stop-sub{font-size:12.5px}
html.m .stop-hrs{font-size:12.5px}
html.m .stop-hrs b{font-size:10.5px}
html.m .btn{padding:9px 16px;font-size:12px}
html.m .qrblock{display:none}      /* the guest is already on the phone */
html.m .top-note{display:none}
/* di HP sheet naik dari bawah, bukan dari samping */
html.m .sheet-panel{margin:auto 0 0;width:100%;max-height:88vh;border-radius:18px 18px 0 0;
                    box-shadow:0 -16px 44px rgba(26,20,34,.3)}
html.m .sheet-head{padding:16px 16px 10px;border-radius:18px 18px 0 0}
html.m .sheet-head h2{font-size:15px}
html.m .sheet-x{font-size:26px}
html.m .chips{padding:11px 16px;gap:7px;flex-wrap:nowrap;overflow-x:auto}
html.m .chip{font-size:12.5px;padding:6px 12px}
html.m .sheet-body{padding:13px 16px calc(22px + env(safe-area-inset-bottom,0px))}
html.m .pc img{width:92px}
html.m .pc-t{font-size:16px}
html.m .pc-bl{font-size:13px}
html.m .pc-m,html.m .pc-now{font-size:11.5px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="https://arc-internal.s3.ap-southeast-1.amazonaws.com/generated_images/upload_1794917145768_irmw12.png"
         alt="Carlton Hotel Singapore">
  </div>
  <div class="top-note">Smart Itinerary</div>
</header>

<main class="wrap">
  <section id="screen-ideas"></section>
  <section id="screen-plan" class="hide"></section>
</main>

<nav class="bar hide" id="bar">
  <button type="button" class="btn btn-ghost" id="backBtn">All ideas</button>
  <span class="spacer"></span>
  <button type="button" class="btn" id="swapBtn">Change plan</button>
</nav>

<div class="sheet hide" id="sheet" role="dialog" aria-modal="true" aria-label="Explore other plans">
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>Explore other plans</h2>
      <button type="button" class="sheet-x" id="sheetX" aria-label="Close">&times;</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
/* arc-plans.js ditanam — satu berkas, supaya bisa dibuka dari file:// */
/* ============================================================
   ARC Smart Itinerary — shared plan catalogue, demo popularity
   and recommendation ranking.

   Loaded by BOTH the kiosk (index.html) and the guest phone page
   (mobile.html) so the two never drift apart.

   There is no backend. Selection counts live in this browser's
   localStorage only: a phone and a kiosk do not share them, and
   they are NOT hotel-wide analytics. See README notes.
   ============================================================ */
(function (root) {
  "use strict";

  var CFG_KEY = "arcPlanCfg.v1";   /* per-plan on / weight / label override */
  var HIT_KEY = "arcPlanHits.v1";  /* explicit selections, by plan id        */

  var CAT = { plans: {}, stops: {}, ids: [], loaded: false };

  /* ---------- storage (never throws) ---------------------- */
  function get(k, fb) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }
    catch (e) { return fb; }
  }
  function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* ---------- catalogue ----------------------------------- */
  function adopt(j) {
    CAT.plans = (j && j.plans) || {};
    CAT.stops = (j && j.stops) || {};
    CAT.ids = Object.keys(CAT.plans);
    CAT.loaded = CAT.ids.length > 0;
    return CAT;
  }
  function load(url) {
    return fetch(url || "catalog.json")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(adopt);
  }
  function plan(id) { return CAT.plans[id] || null; }
  function stop(id) { return CAT.stops[id] || null; }
  function exists(id) { return !!CAT.plans[id]; }

  /* ---------- demo configuration -------------------------- */
  /* Catalogue ships the defaults. Saved config may override
     `on`, `w` and the display label — nothing else, so a catalogue
     update can never be silently overwritten by stale localStorage. */
  function cfg() {
    var saved = get(CFG_KEY, null), by = {};
    if (saved && typeof saved === "object" && !Array.isArray(saved)) by = saved;
    return CAT.ids.map(function (id) {
      var p = CAT.plans[id], o = by[id] || {};
      return {
        id: id,
        label: typeof o.label === "string" && o.label.trim() ? o.label.trim() : p.t,
        title: p.t,
        on: typeof o.on === "boolean" ? o.on : !!p.on,
        w: Number.isFinite(+o.w) ? Math.max(1, Math.min(20, +o.w)) : (+p.w || 1)
      };
    });
  }
  function cfgSave(list) {
    var o = {};
    (list || []).forEach(function (s) {
      if (!s || !s.id || !CAT.plans[s.id]) return;
      o[s.id] = { on: !!s.on, w: Math.max(1, Math.min(20, +s.w || 1)) };
      if (s.label && s.label !== CAT.plans[s.id].t) o[s.id].label = String(s.label).slice(0, 60);
    });
    set(CFG_KEY, o);
  }
  function cfgReset() { try { localStorage.removeItem(CFG_KEY); } catch (e) {} }

  /* ---------- demo popularity ----------------------------- */
  /* Incremented ONLY on an explicit guest choice:
       - tapping a named itinerary shortcut on the kiosk
       - choosing a plan from "Change plan" on the phone
     Never on page open, reload, restore or share.            */
  function hits() { var h = get(HIT_KEY, {}); return (h && typeof h === "object") ? h : {}; }
  function hit(id) {
    if (!exists(id)) return 0;
    var h = hits(); h[id] = (h[id] || 0) + 1; set(HIT_KEY, h); return h[id];
  }
  function hitsReset() { set(HIT_KEY, {}); }

  /* ---------- ranking + rotation --------------------------- */
  /* 1. eligible  = enabled, present in the catalogue, not the active plan
     2. pop slots = highest selection count; ties by weight, then random
     3. rest      = weighted random draw, no duplicates
     4. no counts = weight order, i.e. the configured default ranking   */
  function pick(opt) {
    opt = opt || {};
    var n = opt.n || 4,
        pop = (opt.pop == null ? 2 : opt.pop),
        skip = opt.exclude,
        rnd = opt.rnd || Math.random,
        only = opt.filter;

    var poolAll = cfg().filter(function (s) {
      return s.on && exists(s.id) && s.id !== skip && (!only || only(CAT.plans[s.id], s.id));
    });
    if (!poolAll.length) return [];

    var H = hits(), out = [], used = {};
    var seeded = poolAll.some(function (s) { return (H[s.id] || 0) > 0; });

    var head = poolAll.slice().sort(seeded
      ? function (a, b) { return (H[b.id] || 0) - (H[a.id] || 0) || b.w - a.w || (rnd() - 0.5); }
      : function (a, b) { return b.w - a.w || (a.id < b.id ? -1 : 1); });

    head.slice(0, Math.min(pop, n)).forEach(function (s) { out.push(s); used[s.id] = 1; });

    var rest = poolAll.filter(function (s) { return !used[s.id]; });
    while (out.length < n && rest.length) {
      var tot = 0, i = 0;
      rest.forEach(function (s) { tot += Math.max(1, s.w); });
      var r = rnd() * tot;
      for (; i < rest.length; i++) { r -= Math.max(1, rest[i].w); if (r <= 0) break; }
      if (i >= rest.length) i = rest.length - 1;
      var p = rest.splice(i, 1)[0];
      if (!used[p.id]) { out.push(p); used[p.id] = 1; }
    }
    return out;
  }

  /* which of the returned entries earned their slot from counts */
  function isPopular(id) { return (hits()[id] || 0) > 0; }

  root.ARC = {
    CFG_KEY: CFG_KEY, HIT_KEY: HIT_KEY,
    catalogue: CAT, load: load, adopt: adopt,
    plan: plan, stop: stop, exists: exists,
    cfg: cfg, cfgSave: cfgSave, cfgReset: cfgReset,
    hits: hits, hit: hit, hitsReset: hitsReset,
    pick: pick, isPopular: isPopular
  };
})(typeof window !== "undefined" ? window : this);

</script>
<script>
(function () {
  "use strict";

  var WHITE_MARK = "https://arc-internal.s3.ap-southeast-1.amazonaws.com/generated_images/upload_1794917149814_bxer6q.png";
  var TRANSFER = 20;            /* minutes allowed between stops, as Tanglin does */

  var $ = function (s) { return document.querySelector(s); };
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  /* ---------- mode: ?view= forces it, otherwise width decides ---------- */
  var VIEW_PARAM = (new URLSearchParams(location.search).get("view") || "").toLowerCase();
  function applyMode() {
    var k = VIEW_PARAM === "kiosk" || VIEW_PARAM === "k";
    var m = VIEW_PARAM === "m" || VIEW_PARAM === "mobile" || VIEW_PARAM === "phone";
    if (!k && !m) { m = window.innerWidth < 760; k = !m; }
    document.documentElement.classList.toggle("k", k);
    document.documentElement.classList.toggle("m", m);
    return { kiosk: k, mobile: m };
  }
  var MODE = applyMode();
  if (!VIEW_PARAM) window.addEventListener("resize", function () { MODE = applyMode(); render(); });

  var STATE = { plan: null };

  /* ---------- time ---------- */
  function hhmm(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins / 60), m = mins % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }
  function dur(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    return (h ? h + "h" : "") + (h && m ? " " : "") + (m ? m + "m" : (h ? "" : "0m"));
  }
  function schedule(p) {
    var t = p.start, out = [];
    p.s.forEach(function (row, i) {
      out.push({ id: row[0], mins: row[1], why: row[2], from: t, to: t + row[1], i: i + 1 });
      t += row[1] + TRANSFER;
    });
    return out;
  }
  function totalMins(p) {
    var sum = 0;
    p.s.forEach(function (r) { sum += r[1]; });
    return sum + TRANSFER * Math.max(0, p.s.length - 1);
  }

  /* ---------- stage 1 ---------- */
  function renderIdeas() {
    var host = $("#screen-ideas");
    host.innerHTML = "";

    var lede = el("div", "lede");
    lede.appendChild(el("h1", null, "Ideas for your day"));
    lede.appendChild(el("p", null,
      "Pick one and we will lay the whole day out from the front door, with the walking time to every stop."));
    host.appendChild(lede);

    var grid = el("div", "ideas");
    /* every plan is shown; the order is the ranking, so the itineraries guests
       actually choose rise to the top on their own. */
    ARC.pick({ n: 99, pop: 2 }).forEach(function (row) {
      var p = ARC.plan(row.id), cover = ARC.stop(p.cover);
      var b = el("button", "idea");
      b.type = "button";
      b.setAttribute("data-plan", row.id);

      if (cover && cover.img) {
        var img = el("img", "idea-img");
        img.src = cover.img; img.alt = ""; img.loading = "lazy";
        b.appendChild(img);
      }
      var ic = el("span", "idea-icon", p.icon || "•");
      ic.setAttribute("aria-hidden", "true");
      b.appendChild(ic);

      var body = el("div", "idea-body");
      body.appendChild(el("div", "idea-t", row.label));
      body.appendChild(el("div", "idea-bl", p.bl));

      var meta = el("div", "idea-meta");
      meta.appendChild(el("span", null, p.s.length + " stops"));
      meta.appendChild(el("span", "dot"));
      /* same arithmetic as the stat bar on stage 2, so the two can never disagree */
      meta.appendChild(el("span", null, dur(totalMins(p))));
      if (p.who && p.who.length) {
        meta.appendChild(el("span", "dot"));
        meta.appendChild(el("span", "who", p.who.join(" · ")));
      }
      if (ARC.isPopular(row.id)) meta.appendChild(el("span", "tag-pop", "Popular"));
      body.appendChild(meta);

      b.appendChild(body);
      b.addEventListener("click", function () { choose(row.id); });
      grid.appendChild(b);
    });
    host.appendChild(grid);
  }

  /* ---------- stage 2 ---------- */
  function renderPlan() {
    var host = $("#screen-plan");
    host.innerHTML = "";
    var p = ARC.plan(STATE.plan);
    if (!p) return go("ideas");
    var cover = ARC.stop(p.cover);

    var hero = el("div", "phero");
    if (cover && cover.img) {
      var hi = el("img"); hi.src = cover.img; hi.alt = ""; hero.appendChild(hi);
    }
    hero.appendChild(el("div", "scrim"));
    var mark = el("div", "pmark");
    var mi = el("img"); mi.src = WHITE_MARK; mi.alt = "Carlton Hotel Singapore";
    mark.appendChild(mi); hero.appendChild(mark);
    var txt = el("div", "ptxt");
    txt.appendChild(el("p", "eyebrow", "Your day, planned"));
    txt.appendChild(el("h1", null, p.t));
    hero.appendChild(txt);
    host.appendChild(hero);

    var rows = schedule(p);
    var stats = el("div", "pstats");
    [[dur(totalMins(p)), "in total"],
     [p.s.length + (p.s.length === 1 ? " stop" : " stops"), "chosen for you"],
     [hhmm(p.start), "suggested start"]].forEach(function (c) {
      var cell = el("div", "pstat");
      cell.appendChild(el("b", null, c[0]));
      cell.appendChild(el("span", null, c[1]));
      stats.appendChild(cell);
    });
    host.appendChild(stats);

    var list = el("ol", "tl");
    rows.forEach(function (r) {
      var s = ARC.stop(r.id);
      if (!s) return;
      var li = el("li", "stop");

      var when = el("div", "stop-when");
      when.appendChild(el("b", null, hhmm(r.from)));
      when.appendChild(el("span", null, String(r.i).padStart(2, "0")));
      li.appendChild(when);

      /* a stop whose photo is missing drops the column rather than leaving a
         grey rectangle — the same guard Tanglin uses for Tanglin Mall. */
      if (s.img) {
        var im = el("img", "stop-img");
        im.src = s.img; im.alt = ""; im.loading = "lazy";
        li.appendChild(im);
      } else {
        li.className += " nopic";
      }

      var body = el("div", "stop-body");
      body.appendChild(el("h3", null, s.n));
      body.appendChild(el("p", "stop-why", r.why || s.d || ""));

      var sub = el("div", "stop-sub");
      sub.appendChild(el("span", null, r.mins + " min"));
      if (s.c) { sub.appendChild(el("span", "dot")); sub.appendChild(el("span", null, s.c)); }
      /* far is measured FROM THE HOTEL, not from the previous stop, so it is
         labelled as such — read bare inside a sequence it says the wrong thing.
         It is blank for six entries whose distance was never measured, and
         nothing is invented in its place. */
      if (s.far) {
        sub.appendChild(el("span", "dot"));
        sub.appendChild(el("span", null, s.far + " from the hotel"));
      }
      body.appendChild(sub);

      /* Opening hours, where KM has them. Shown because a plan can otherwise
         send a guest to a place that is shut — Children's Museum closes on
         Mondays, and the plan that includes it starts at 10:00. */
      if (s.h) {
        var hrow = el("p", "stop-hrs");
        hrow.appendChild(el("b", null, "Hours"));
        hrow.appendChild(el("span", null, " " + s.h));
        body.appendChild(hrow);
      }

      /* Amity map renders inside the kiosk application; Google Maps is the
         useful one once the guest has scanned the QR and is on their phone. */
      var href = MODE.mobile ? (s.mapg || s.map) : (s.map || s.mapg);
      if (href) {
        var a = el("a", "btn", "Directions");
        a.href = href; a.target = "_blank"; a.rel = "noopener";
        body.appendChild(a);
      }

      li.appendChild(body);
      list.appendChild(li);
    });
    host.appendChild(list);

    if (!MODE.mobile) host.appendChild(qrBlock());
  }

  function shareUrl() {
    var u = new URL(location.href);
    u.searchParams.set("plan", STATE.plan);
    u.searchParams.set("view", "m");
    return u.toString();
  }
  function qrBlock() {
    var wrap = el("div", "qrblock");
    var box = el("div", "qrbox");
    wrap.appendChild(box);
    try {
      new QRCode(box, { text: shareUrl(), width: 190, height: 190,
                        colorDark: "#372B4F", colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M });
    } catch (e) { box.remove(); }
    var t = el("div");
    t.appendChild(el("p", "qr-e", "Take it with you"));
    t.appendChild(el("p", "qr-t", "Scan to open this plan on your phone"));
    t.appendChild(el("p", "qr-p",
      "Directions for every stop. No app and no sign-in needed."));
    wrap.appendChild(t);
    return wrap;
  }

  /* ---------- sheet: ganti rencana ---------- */
  /* Buckets dipilih supaya tidak ada rencana yang jatuh di celah: durasi nyata
     kita 2.0 2.5 3.2 4.0 5.2 6.0 6.2 6.2 6.7 6.8 6.8 7.3 jam. */
  var FILTERS = [
    ["all",      "All plans",    null],
    ["short",    "Under 3h",     function (p) { return totalMins(p) < 180; }],
    ["mid",      "3-6 hours",    function (p) { return totalMins(p) >= 180 && totalMins(p) <= 360; }],
    ["long",     "6 hours +",    function (p) { return totalMins(p) > 360; }],
    ["family",   "Family",       function (p) { return who(p, "family"); }],
    ["couple",   "Couples",      function (p) { return who(p, "couple"); }],
    ["friends",  "Friends",      function (p) { return who(p, "friends"); }],
    ["solo",     "Solo",         function (p) { return who(p, "solo"); }],
    ["business", "Business",     function (p) { return who(p, "business"); }]
  ];
  function who(p, k) { return !!(p.who && p.who.indexOf(k) >= 0); }
  var FILTER = "all";

  function drawChips() {
    var host = $("#chips");
    host.innerHTML = "";
    FILTERS.forEach(function (f) {
      /* a chip that would show nothing is not offered at all */
      if (f[2] && !ARC.cfg().some(function (s) {
            return s.on && ARC.exists(s.id) && f[2](ARC.plan(s.id)); })) return;
      var b = el("button", "chip", f[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(FILTER === f[0]));
      b.addEventListener("click", function () { FILTER = f[0]; drawChips(); drawSheet(); });
      host.appendChild(b);
      /* di HP barisnya menggulung ke samping, jadi chip terpilih dibawa ke tampak */
      if (FILTER === f[0] && f[0] !== "all" && b.scrollIntoView) {
        try { b.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) {}
      }
    });
  }

  function planCard(id) {
    var p = ARC.plan(id), cover = ARC.stop(p.cover), current = id === STATE.plan;
    var b = el("button", "pc" + (current ? " cur" : ""));
    b.type = "button";
    if (current) b.disabled = true;
    if (cover && cover.img) {
      var im = el("img"); im.src = cover.img; im.alt = ""; im.loading = "lazy";
      b.appendChild(im);
    }
    var body = el("div", "pc-b");
    body.appendChild(el("div", "pc-t", p.t));
    body.appendChild(el("div", "pc-bl", p.bl));
    var m = el("div", "pc-m");
    m.appendChild(el("span", null, dur(totalMins(p))));
    m.appendChild(el("span", "dot"));
    m.appendChild(el("span", null, p.s.length + " stops"));
    if (p.who && p.who.length) {
      m.appendChild(el("span", "dot"));
      m.appendChild(el("span", "who", p.who.join(" · ")));
    }
    if (ARC.isPopular(id)) { m.appendChild(el("span", "dot")); m.appendChild(el("span", "tag-pop", "Popular")); }
    body.appendChild(m);
    if (current) body.appendChild(el("div", "pc-now", "Your current plan"));
    b.appendChild(body);
    if (!current) b.addEventListener("click", function () { closeSheet(); choose(id); });
    return b;
  }

  function drawSheet() {
    var host = $("#sheetBody");
    host.innerHTML = "";
    var f = FILTERS.filter(function (x) { return x[0] === FILTER; })[0];
    var list = ARC.pick({ n: 99, pop: 2, filter: f && f[2] ? function (p) { return f[2](p); } : null });
    if (!list.length) {
      host.appendChild(el("p", "sheet-none", "No plans match that filter."));
      return;
    }
    list.forEach(function (row) { host.appendChild(planCard(row.id)); });
  }

  function openSheet() {
    FILTER = "all";
    drawChips(); drawSheet();
    $("#sheet").classList.remove("hide");
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    $("#sheet").classList.add("hide");
    document.body.style.overflow = "";
  }
  $("#swapBtn").addEventListener("click", openSheet);
  $("#sheetX").addEventListener("click", closeSheet);
  $("#sheetBack").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheet();
  });

  /* ---------- navigation ---------- */
  function go(screen) {
    var ideas = screen === "ideas";
    $("#screen-ideas").classList.toggle("hide", !ideas);
    $("#screen-plan").classList.toggle("hide", ideas);
    $("#bar").classList.toggle("hide", ideas);
    window.scrollTo(0, 0);
  }
  function choose(id, count) {
    if (!ARC.exists(id)) return;
    STATE.plan = id;
    /* popularity moves only on a real choice, never on open, reload or share */
    if (count !== false) ARC.hit(id);
    renderPlan();
    go("plan");
    var u = new URL(location.href);
    u.searchParams.set("plan", id);
    history.replaceState(null, "", u);
  }
  function render() {
    renderIdeas();
    if (STATE.plan) renderPlan();
  }

  $("#backBtn").addEventListener("click", function () {
    STATE.plan = null;
    var u = new URL(location.href);
    u.searchParams.delete("plan");
    history.replaceState(null, "", u);
    go("ideas");
  });

  /* ---------- boot ---------- */
  function embedded(id) {
    var n = document.getElementById(id);
    if (!n) throw new Error("blok data " + id + " tidak ada");
    return JSON.parse(n.textContent);
  }
  try {
    var cat = embedded("arc-catalog"), stp = embedded("arc-stops");
    ARC.adopt({ plans: cat.plans, stops: stp });
    renderIdeas();
    var want = new URLSearchParams(location.search).get("plan");
    /* arriving by QR or a shared link is not a choice, so it must not count */
    if (want && ARC.exists(want)) choose(want, false); else go("ideas");
  } catch (e) {
    $("#screen-ideas").innerHTML =
      '<div class="lede"><h1>Itinerary unavailable</h1><p>The plan list could not be loaded. '
      + 'Please ask at the front desk.</p></div>';
    if (window.console) console.error("[carlton-itinerary]", e);
  }
})();
</script>
</body>
</html>
